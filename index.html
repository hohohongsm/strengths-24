const STRENGTHS=[{"code": "W01", "name": "창의성", "virtue": "지혜", "subtitle": "", "sections": {"core": "기존 방식에 머무르지 않고 새로운 관점과 방법을 떠올리는 강점이다. 단순히 특이한 생각을 내는 데 그치지 않고, 상황에 도움이 되는 방식으로 아이디어를 연결하고 발전시키는 모습으로 나타난다.", "work": "익숙한 업무에서도 개선할 점을 찾고 여러 해결 방법을 제안하는 모습으로 나타난다. 막힌 문제를 다른 각도에서 바라보거나 기존 자원을 새롭게 조합해 대안을 만들 수 있다.", "relationship": "상대와의 차이를 문제로만 보기보다 새로운 이해 방식이나 해결책을 찾는 데 도움이 된다. 함께 무언가를 할 때 색다른 아이디어를 보태 관계에 활기를 줄 수 있다.", "underuse": "이 강점이 덜 드러날 때는 익숙하고 검증된 방식에 의지해 안정적으로 처리하는 대신, 새로운 대안을 충분히 탐색하지 않을 수 있다.", "overuse": "지나치게 쓰이면 실현 가능성을 검토하기 전에 아이디어가 계속 늘어나거나, 이미 효과적인 방식까지 불필요하게 바꾸려 할 수 있다.", "balance": "아이디어를 낸 뒤 목적·효과·실행 가능성을 함께 확인한다. 새로운 시도와 기존 방식의 장점을 비교하고, 작게 시험한 뒤 확대하면 창의성을 현실적인 변화로 연결할 수 있다."}}, {"code": "W02", "name": "호기심", "virtue": "지혜", "subtitle": "", "sections": {"core": "낯선 대상에서 궁금한 점을 발견하고 직접 알아보려는 강점이다. 주어진 정보에 머무르지 않고 질문하고 탐색하면서 이해의 범위를 넓히는 모습으로 나타난다.", "work": "새로운 업무나 변화의 배경을 궁금해하고 필요한 정보를 자발적으로 찾는 모습으로 나타난다. 당연하게 여겨 온 절차에도 질문을 던져 놓치고 있던 가능성을 발견할 수 있다.", "relationship": "상대의 생각과 경험에 관심을 갖고 질문하면서 서로를 더 깊이 이해하는 데 도움이 된다. 다양한 관점을 접할 때 판단보다 탐색을 먼저 할 수 있다.", "underuse": "이 강점이 덜 드러날 때는 현재 알고 있는 정보와 익숙한 경험을 중심으로 판단해, 새로운 정보나 관점을 접할 기회가 줄어들 수 있다.", "overuse": "지나치게 쓰이면 핵심 목적과 직접 관련 없는 정보까지 계속 탐색하거나, 상대가 부담스러울 만큼 질문이 많아질 수 있다.", "balance": "무엇을 왜 알고 싶은지 먼저 정하고, 필요한 탐색 범위와 시간을 정한다. 관계에서는 질문만 이어가기보다 자신의 생각도 나누고 상대가 답하고 싶은 범위를 존중한다."}}, {"code": "W03", "name": "판단력", "virtue": "지혜", "subtitle": "", "sections": {"core": "여러 정보와 관점을 열린 태도로 검토한 뒤 근거에 따라 결론을 내리는 강점이다. 처음의 생각을 고집하기보다 새로운 정보가 충분하면 판단을 조정하는 모습으로 나타난다.", "work": "사실과 의견을 구분하고, 결정 전에 근거와 반대 관점을 함께 살피는 모습으로 나타난다. 성급한 결론을 줄이고 선택의 타당성을 높이는 데 도움이 된다.", "relationship": "한쪽 이야기만 듣고 단정하기보다 각자의 입장과 상황을 확인하려는 태도로 나타난다. 감정적인 순간에도 사실과 해석을 나누어 대화를 이어갈 수 있다.", "underuse": "이 강점이 덜 드러날 때는 처음 받은 정보나 익숙한 관점에 영향을 받아 충분한 검토 전에 결론을 내릴 수 있다.", "overuse": "지나치게 쓰이면 모든 근거가 충분해질 때까지 판단을 미루거나, 상대의 감정보다 논리적 타당성을 먼저 따질 수 있다.", "balance": "결정의 중요도에 맞춰 필요한 근거 수준과 검토 시간을 정한다. 논리적 판단과 함께 사람에게 미칠 영향도 살피고, 충분한 정보가 모이면 결론을 행동으로 옮긴다."}}, {"code": "W04", "name": "학구열", "virtue": "지혜", "subtitle": "", "sections": {"core": "새로운 지식과 기술을 배우고 깊이 익히는 과정에서 만족을 느끼는 강점이다. 단순히 정보를 모으는 데 그치지 않고 이해하고 숙달하려는 모습으로 나타난다.", "work": "필요한 전문성을 스스로 보완하고, 새롭게 배운 내용을 업무에 적용하는 모습으로 나타난다. 변화하는 환경에서도 학습을 통해 적응의 기반을 만들 수 있다.", "relationship": "자신이 알지 못하는 경험과 관점을 배우려는 태도가 관계의 폭을 넓힌다. 배운 내용을 나누어 서로의 성장에 기여할 수 있다.", "underuse": "이 강점이 덜 드러날 때는 당장 필요한 수준에서 업무를 처리하며, 지식이나 기술을 더 깊게 확장할 기회가 줄어들 수 있다.", "overuse": "지나치게 쓰이면 충분히 배운 뒤에야 시작하려 하거나, 학습 자체에 몰두해 실제 적용이 늦어질 수 있다.", "balance": "배울 내용과 실제 해결할 과제를 연결한다. 완벽히 익히기를 기다리기보다 작은 단위로 적용하고, 실행에서 얻은 반응을 다시 학습으로 이어간다."}}, {"code": "W05", "name": "통찰", "virtue": "지혜", "subtitle": "", "sections": {"core": "흩어진 정보와 경험을 연결해 전체 흐름과 핵심 의미를 파악하는 강점이다. 눈앞의 현상만 보기보다 그 배경과 앞으로의 영향을 함께 바라보는 모습으로 나타난다.", "work": "복잡한 상황에서 핵심 쟁점을 정리하고, 현재의 선택이 장기적으로 어떤 영향을 줄지 살피는 모습으로 나타난다. 여러 의견을 더 큰 맥락 안에서 연결해 방향을 제시할 수 있다.", "relationship": "상대의 말 한마디보다 반복되는 상황과 관계의 흐름을 함께 살피는 데 도움이 된다. 당장의 갈등을 넘어 서로에게 중요한 것이 무엇인지 발견할 수 있다.", "underuse": "이 강점이 덜 드러날 때는 개별 정보와 당장의 과제에 집중해 전체 맥락이나 장기적인 의미를 놓칠 수 있다.", "overuse": "지나치게 쓰이면 충분한 확인 없이 숨은 의미를 앞서 해석하거나, 큰 그림을 강조하다 구체적인 현실을 놓칠 수 있다.", "balance": "발견한 핵심과 맥락을 구체적인 사실로 다시 확인한다. 큰 방향을 제시할 때는 바로 실행할 수 있는 다음 행동까지 함께 정리한다."}}, {"code": "C01", "name": "용기", "virtue": "용기", "subtitle": "", "sections": {"core": "두려움·부담·반대가 있더라도 필요하고 중요하다고 판단한 행동을 선택하는 강점이다. 두려움이 없는 상태가 아니라, 두려움 속에서도 한 걸음 내딛는 모습으로 나타난다.", "work": "말하기 어려운 문제를 제기하거나, 책임 있는 선택이 필요할 때 의견을 표현하는 모습으로 나타난다. 실패 가능성이 있어도 충분히 검토한 시도를 시작할 수 있다.", "relationship": "불편함을 피하기보다 필요한 이야기를 정중하게 꺼내고, 소중한 관계를 위해 솔직한 대화를 시도하는 데 도움이 된다. 부당한 상황에서 자신의 기준을 표현할 수도 있다.", "underuse": "이 강점이 덜 드러날 때는 부담이나 비판이 예상되는 상황에서 필요한 말과 행동을 미루며 안전한 선택을 우선할 수 있다.", "overuse": "지나치게 쓰이면 위험과 영향을 충분히 살피지 않고 맞서거나, 솔직함을 이유로 상대의 준비 상태를 고려하지 않을 수 있다.", "balance": "행동하기 전에 지키려는 가치와 감수할 위험을 함께 확인한다. 용기를 내되 표현 방식과 시점을 조절하고, 필요한 지원과 대비책을 마련한다."}}, {"code": "C02", "name": "끈기", "virtue": "용기", "subtitle": "", "sections": {"core": "장애와 지연이 있어도 목표를 향한 노력을 이어가고 시작한 일을 마무리하려는 강점이다. 결과가 바로 보이지 않을 때도 다시 시도하며 지속하는 모습으로 나타난다.", "work": "예상보다 일이 어렵거나 시간이 걸려도 필요한 과정을 이어가는 모습으로 나타난다. 중간의 실패를 최종 결론으로 여기지 않고 다시 시도해 결과를 만들어 낼 수 있다.", "relationship": "관계가 일시적으로 어려워져도 한 번의 갈등만으로 포기하지 않고 필요한 노력을 이어가는 데 도움이 된다. 약속한 관심과 지원을 꾸준히 보여줄 수 있다.", "underuse": "이 강점이 덜 드러날 때는 성과가 늦거나 장애가 생기면 노력의 방향을 유지하기 어려워지고, 시작한 일이 중간에 멈출 수 있다.", "overuse": "지나치게 쓰이면 이미 효과가 낮아진 목표나 방법을 놓지 못하고, 쉬거나 방향을 바꿔야 할 때도 계속 밀어붙일 수 있다.", "balance": "지속할 가치가 있는 목표인지 주기적으로 확인하고, 목표와 방법을 구분한다. 목표는 유지하되 방법은 바꿀 수 있으며, 회복을 위한 휴식도 지속의 일부로 본다."}}, {"code": "C03", "name": "정직성", "virtue": "용기", "subtitle": "", "sections": {"core": "자신을 과장하거나 가장하지 않고 생각·말·행동을 가능한 한 일치시키는 강점이다. 실수와 한계를 감추기보다 사실대로 인정하고 책임 있게 설명하는 모습으로 나타난다.", "work": "모르는 것을 아는 척하지 않고, 실수나 진행 상황을 사실에 가깝게 공유하는 모습으로 나타난다. 사람이나 상황에 따라 핵심 원칙을 쉽게 바꾸지 않아 신뢰를 만드는 데 도움이 된다.", "relationship": "속마음을 무조건 숨기거나 꾸미기보다 관계에 필요한 진실을 솔직하게 나누는 데 도움이 된다. 말과 행동의 일관성이 상대에게 예측 가능성과 안정감을 줄 수 있다.", "underuse": "이 강점이 덜 드러날 때는 좋게 보이거나 갈등을 피하기 위해 실제 생각과 다른 태도를 보이며, 말과 행동 사이에 간격이 생길 수 있다.", "overuse": "지나치게 쓰이면 모든 생각을 그대로 말하는 것이 정직하다고 여기거나, 상대의 상황과 감정을 고려하지 않은 표현이 될 수 있다.", "balance": "사실을 숨기지 않되 무엇을 언제 어떻게 말할지 함께 고려한다. 솔직함의 목적을 분명히 하고, 상대를 존중하는 표현과 자신의 행동에 대한 책임을 더한다."}}, {"code": "C04", "name": "활력", "virtue": "용기", "subtitle": "", "sections": {"core": "일상과 활동에 생동감·에너지·열의를 가지고 참여하는 강점이다. 해야 할 일을 수동적으로 견디기보다 의미를 찾고 적극적으로 움직이는 모습으로 나타난다.", "work": "맡은 일에 에너지를 투입하고 주변의 참여 분위기를 북돋는 모습으로 나타난다. 새로운 과제나 변화에도 생기 있게 접근해 시작의 동력을 만들 수 있다.", "relationship": "함께하는 시간에 관심과 생기를 더해 관계의 분위기를 밝게 만들 수 있다. 상대의 기쁨이나 새로운 시도에 적극적으로 반응하는 모습으로 나타난다.", "underuse": "이 강점이 덜 드러날 때는 필요한 만큼만 참여하거나 에너지를 아끼면서, 활동의 의미와 즐거움을 충분히 느끼지 못할 수 있다.", "overuse": "지나치게 쓰이면 자신의 속도를 주변에도 기대하거나, 충분히 쉬어야 할 신호를 놓치고 계속 에너지를 사용할 수 있다.", "balance": "에너지를 쏟을 우선순위를 정하고 회복 시간을 함께 확보한다. 주변의 속도와 상태를 살피며 활력을 강요하기보다 선택할 수 있는 참여의 동력으로 나눈다."}}, {"code": "H01", "name": "사랑", "virtue": "인간애", "subtitle": "", "sections": {"core": "가까운 사람과 관심·애정·돌봄을 주고받는 관계를 중요하게 여기고 유지하는 강점이다. 일방적으로 베푸는 것뿐 아니라 필요할 때 상대의 도움과 마음을 받아들이는 모습도 포함한다.", "work": "함께 일하는 사람을 역할만으로 대하지 않고 지속적인 관심과 신뢰를 쌓는 모습으로 나타난다. 어려운 시기에 정서적인 지지를 주고받으며 관계의 안정성을 높일 수 있다.", "relationship": "소중한 사람에게 마음과 관심을 표현하고, 관계를 유지하기 위해 시간과 노력을 기울이는 모습으로 나타난다. 가까운 사람의 돌봄을 받아들이며 상호적인 연결을 만든다.", "underuse": "이 강점이 덜 드러날 때는 가까운 관계에서도 속마음과 필요한 도움을 드러내지 않아 정서적인 거리가 커질 수 있다.", "overuse": "지나치게 쓰이면 관계를 지키기 위해 자신의 필요를 뒤로 미루거나, 가까운 사람의 선택과 감정에 지나치게 관여할 수 있다.", "balance": "관심과 애정을 표현하면서도 서로의 경계와 자율성을 존중한다. 돌봄을 주는 것과 받는 것의 균형을 살피고, 관계 밖에서 자신을 돌보는 시간도 확보한다."}}, {"code": "H02", "name": "친절", "virtue": "인간애", "subtitle": "", "sections": {"core": "대가나 의무만을 따지지 않고 다른 사람에게 도움과 배려를 행동으로 제공하는 강점이다. 상대의 필요를 알아차리고 자신이 할 수 있는 범위에서 실제 행동으로 옮기는 모습으로 나타난다.", "work": "어려움을 겪는 사람에게 정보·시간·도움을 나누고, 작은 불편을 줄이려는 모습으로 나타난다. 협력적인 분위기와 상호 지원을 만드는 데 기여할 수 있다.", "relationship": "상대의 상황을 세심하게 살피고 필요한 배려를 행동으로 보여주는 데 도움이 된다. 친밀하지 않은 사람에게도 기본적인 관심과 호의를 표현할 수 있다.", "underuse": "이 강점이 덜 드러날 때는 자신의 일과 필요에 집중하면서 주변이 필요로 하는 도움을 알아차리거나 행동으로 옮길 기회가 줄어들 수 있다.", "overuse": "지나치게 쓰이면 요청받지 않은 도움으로 상대의 자율성을 침해하거나, 자신의 시간과 에너지를 과도하게 사용할 수 있다.", "balance": "돕기 전에 상대가 원하는 도움이 무엇인지 확인한다. 자신이 감당할 수 있는 범위를 정하고, 친절을 베푸는 것과 필요한 경우 거절하는 것을 함께 연습한다."}}, {"code": "H03", "name": "사회적 지능", "virtue": "인간애", "subtitle": "", "sections": {"core": "자신과 타인의 감정·동기를 알아차리고 사람들 사이의 상황을 파악해 적절하게 반응하는 강점이다. 사교적인 정도와는 다르며, 관계의 미묘한 변화와 맥락을 읽는 모습으로 나타난다.", "work": "표정·말투·참여 정도의 변화를 살피고 상황에 맞게 소통 방식을 조정하는 모습으로 나타난다. 겉으로 드러난 말뿐 아니라 그 배경의 필요를 파악해 협업과 갈등 조정에 도움을 줄 수 있다.", "relationship": "상대가 직접 말하지 않은 감정과 의도를 헤아리고, 관계의 분위기에 맞게 반응하는 데 도움이 된다. 자신의 감정이 관계에 미치는 영향도 돌아볼 수 있다.", "underuse": "이 강점이 덜 드러날 때는 상대가 명확하게 표현한 정보에 주로 의지해, 말하지 않은 불편이나 관계의 변화를 뒤늦게 알아차릴 수 있다.", "overuse": "지나치게 쓰이면 상대의 반응을 계속 해석하느라 자신의 생각을 충분히 표현하지 못하거나, 확인되지 않은 의도를 앞서 추측할 수 있다.", "balance": "알아차린 분위기와 감정을 사실로 단정하지 말고 질문을 통해 확인한다. 관계를 살피는 것과 자신의 입장과 필요를 분명히 표현하는 것을 함께 유지한다."}}, {"code": "J01", "name": "팀워크", "virtue": "정의", "subtitle": "", "sections": {"core": "공동의 목표와 전체의 성과를 위해 자신의 역할을 수행하고 다른 구성원과 협력하는 강점이다. 개인의 성과만이 아니라 서로의 역할이 어떻게 연결되는지 살피는 모습으로 나타난다.", "work": "필요한 정보와 자원을 공유하고, 전체 진행에 맞춰 자신의 방식과 일정을 조정하는 모습으로 나타난다. 공동의 결과를 위해 맡은 역할 밖의 연결 지점도 살필 수 있다.", "relationship": "함께 정한 약속과 목표를 존중하고, 자신의 몫을 다하며 신뢰를 쌓는 데 도움이 된다. 서로 다른 장점을 연결해 혼자보다 나은 결과를 만들 수 있다.", "underuse": "이 강점이 덜 드러날 때는 자신의 업무와 성과에 집중하면서 전체 흐름이나 다른 사람과의 연결을 충분히 살피지 못할 수 있다.", "overuse": "지나치게 쓰이면 집단의 조화를 위해 다른 의견을 말하지 못하거나, 개인의 경계와 우선순위를 지나치게 양보할 수 있다.", "balance": "공동 목표와 자신의 역할을 분명히 하되 필요한 이견은 솔직하게 제시한다. 협력할 부분과 각자 책임질 부분을 구분하고, 기여와 부담이 한쪽에 몰리지 않는지 살핀다."}}, {"code": "J02", "name": "공정성", "virtue": "정의", "subtitle": "", "sections": {"core": "개인적인 호불호나 이해관계에 치우치지 않고 일관되고 균형 있는 기준으로 사람을 대하려는 강점이다. 서로 다른 입장을 듣고 기회와 책임이 한쪽에만 유리하지 않은지 살피는 모습으로 나타난다.", "work": "역할·기회·업무를 나눌 때 적용 기준을 확인하고, 비슷한 상황에는 비슷한 원칙을 적용하려는 모습으로 나타난다. 의견이 충돌할 때 어느 한쪽을 판단하기 전에 각자의 이야기를 들을 수 있다.", "relationship": "가까운 정도에 따라 기준을 크게 바꾸기보다 상대를 동등하게 존중하는 데 도움이 된다. 갈등에서도 자신에게 유리한 결과보다 모두가 납득할 수 있는 기준을 찾으려 한다.", "underuse": "이 강점이 덜 드러날 때는 친분·선입견·현재 감정이 판단에 더 크게 작용해 사람마다 다른 기준이 적용될 수 있다.", "overuse": "지나치게 쓰이면 서로 다른 상황과 필요를 충분히 고려하지 않고 모두에게 똑같은 방식만 적용하거나, 관계의 정서적인 부분을 놓칠 수 있다.", "balance": "동일한 기준과 개별 상황에 대한 고려를 함께 살핀다. 기준을 투명하게 설명하고, 결정에 영향을 받는 사람의 의견을 들으며 필요한 경우 합리적으로 조정한다."}}, {"code": "J03", "name": "리더십", "virtue": "정의", "subtitle": "", "sections": {"core": "여러 사람이 함께할 때 공동의 방향을 분명히 하고 참여와 협력을 이끄는 강점이다. 공식적인 지위와 관계없이, 상황이 정체되거나 의견이 흩어질 때 앞으로 나아갈 기준을 제시하는 모습으로 나타난다.", "work": "목표와 진행 방향을 정리하고 구성원이 참여할 수 있는 기회를 만드는 모습으로 나타난다. 일이 막혔을 때 선택 기준을 제시하고 역할과 자원을 연결해 다시 움직이게 할 수 있다.", "relationship": "함께해야 할 일이 있을 때 각자의 의견을 듣고 공통의 방향을 만드는 데 도움이 된다. 다른 사람이 자신의 역할을 발휘하도록 격려하고 참여를 촉진할 수 있다.", "underuse": "이 강점이 덜 드러날 때는 방향을 정할 사람이 필요한 상황에서도 다른 사람이 나서기를 기다리며, 공동의 진행이 늦어질 수 있다.", "overuse": "지나치게 쓰이면 자신의 방향을 빠르게 제시하느라 다른 사람의 의견과 주도성을 줄이거나, 필요 이상으로 책임과 결정을 맡을 수 있다.", "balance": "방향을 제시하기 전에 구성원의 의견과 상황을 충분히 듣는다. 결정할 때와 기다릴 때를 구분하고, 역할과 권한을 나누어 다른 사람도 주도할 수 있게 한다."}}, {"code": "T01", "name": "용서", "virtue": "절제", "subtitle": "", "sections": {"core": "받은 상처와 잘못을 부정하지 않으면서도 적대감과 보복 욕구에 계속 매이지 않으려는 강점이다. 잘못을 정당화하거나 관계를 반드시 회복하는 것이 아니라, 상처가 자신의 현재를 계속 지배하지 않도록 놓아가는 모습이다.", "work": "실수와 갈등이 있었을 때 책임은 분명히 하되 그 일을 상대의 전체 모습으로 확대하지 않는 데 도움이 된다. 변화와 책임 있는 행동이 확인되면 다시 협력할 가능성을 열어둘 수 있다.", "relationship": "상처받은 경험을 인정하면서도 같은 일을 계속 들추거나 보복하려는 마음에서 조금씩 벗어날 수 있다. 사과와 변화가 진심이라고 느껴질 때 관계의 다음 선택을 차분히 생각하는 모습으로 나타난다.", "underuse": "이 강점이 덜 드러날 때는 과거의 상처와 분노가 오래 남아 현재의 판단이나 관계에 계속 영향을 줄 수 있다.", "overuse": "지나치게 쓰이면 충분한 사과와 변화가 없는데도 문제를 빨리 덮거나, 필요한 경계와 책임 확인을 생략할 수 있다.", "balance": "용서와 책임, 용서와 관계 회복을 서로 구분한다. 감정을 충분히 인정하고 필요한 경계를 세운 뒤, 자신에게 도움이 되는 속도로 적대감에서 벗어날 방법을 선택한다."}}, {"code": "T02", "name": "겸손", "virtue": "절제", "subtitle": "", "sections": {"core": "자신의 장점과 성취를 과장하지 않고 한계와 다른 사람의 기여를 함께 인정하는 강점이다. 자신을 낮추는 것이 아니라, 자신과 타인의 몫을 실제에 가깝게 바라보는 모습으로 나타난다.", "work": "좋은 결과에서 함께한 사람의 기여를 인정하고, 모르는 부분에서는 도움과 조언을 받아들이는 모습으로 나타난다. 자신의 성과를 지나치게 앞세우지 않아 협력과 학습의 여지를 만들 수 있다.", "relationship": "자신이 옳다는 것을 증명하기보다 상대에게 배울 점과 자신의 영향을 돌아보는 데 도움이 된다. 실수나 한계를 인정해 관계의 방어적인 분위기를 낮출 수 있다.", "underuse": "이 강점이 덜 드러날 때는 자신의 역할과 성과를 크게 강조하거나, 다른 사람의 기여와 조언을 받아들이기 어려울 수 있다.", "overuse": "지나치게 쓰이면 실제 기여와 능력까지 축소해 표현하거나, 필요한 자리에서 자신의 성과와 의견을 드러내지 못할 수 있다.", "balance": "자신의 기여와 타인의 기여를 모두 구체적으로 인정한다. 겸손을 자기 축소와 구분하고, 필요한 상황에서는 사실에 근거해 성과와 전문성을 분명하게 표현한다."}}, {"code": "T03", "name": "신중함", "virtue": "절제", "subtitle": "", "sections": {"core": "행동이나 결정을 내리기 전에 예상되는 결과와 위험을 살피는 강점이다. 충동적으로 선택하기보다 감당할 수 있는지 확인하고 불필요한 후회를 줄이려는 모습으로 나타난다.", "work": "중요한 결정 전에 위험·부담·후속 영향을 검토하고, 지킬 수 있는 약속과 책임을 선택하는 모습으로 나타난다. 잠재적인 문제를 미리 발견해 안정적인 실행을 돕는다.", "relationship": "감정이 앞서는 순간에도 말과 행동이 상대에게 어떤 영향을 줄지 한 번 더 생각하는 데 도움이 된다. 쉽게 약속하기보다 실제로 지킬 수 있는 범위를 확인할 수 있다.", "underuse": "이 강점이 덜 드러날 때는 선택의 영향과 위험이 충분히 보이지 않은 상태에서 먼저 결정해 예상하지 못한 부담이 생길 수 있다.", "overuse": "지나치게 쓰이면 위험을 줄이려는 검토가 길어져 결정과 시도가 늦어지거나, 가능성보다 문제를 먼저 보게 될 수 있다.", "balance": "결정의 중요도에 따라 검토할 범위와 시간을 정한다. 회복 가능한 작은 선택은 빠르게 시도하고, 영향이 큰 결정에는 충분한 점검과 대비책을 마련한다."}}, {"code": "T04", "name": "자기조절", "virtue": "절제", "subtitle": "", "sections": {"core": "감정·충동·주의·습관을 자신의 목표와 상황에 맞게 조정하는 강점이다. 순간의 기분에 끌려가기보다 선택한 방향을 유지하도록 자신을 관리하는 모습으로 나타난다.", "work": "집중을 방해하는 요소를 관리하고, 감정이 크게 흔들릴 때도 바로 반응하기보다 행동을 조절하는 모습으로 나타난다. 목표에 필요한 습관과 일정을 유지해 안정적인 수행을 돕는다.", "relationship": "감정이 격해진 순간에 즉시 말하거나 행동하지 않고 반응을 조절하는 데 도움이 된다. 자신의 감정을 억누르기보다 적절한 방식과 시점을 선택할 수 있다.", "underuse": "이 강점이 덜 드러날 때는 기분과 충동에 따라 계획이나 반응이 자주 달라져 원하는 방향을 유지하기 어려울 수 있다.", "overuse": "지나치게 쓰이면 감정과 욕구를 지나치게 통제해 긴장이 쌓이거나, 계획에서 벗어나는 상황에 유연하게 대응하기 어려울 수 있다.", "balance": "조절해야 할 것과 자연스럽게 허용해도 될 것을 구분한다. 감정을 없애려 하기보다 알아차리고 표현 방식을 선택하며, 계획 안에 휴식과 예외의 여지를 둔다."}}, {"code": "X01", "name": "심미안", "virtue": "초월", "subtitle": "", "sections": {"core": "자연·예술·능력·성과에서 아름다움과 탁월함을 발견하고 깊이 느끼는 강점이다. 단순한 취향을 넘어 잘 만들어진 것과 뛰어난 수행의 가치를 알아보는 모습으로 나타난다.", "work": "완성도 높은 결과물과 뛰어난 전문성을 알아보고 그 가치를 구체적으로 인정하는 모습으로 나타난다. 품질·구성·표현의 세부 차이를 살펴 결과의 수준을 높이는 데 도움이 된다.", "relationship": "상대의 재능과 노력에서 빛나는 부분을 발견하고 진심으로 감탄하거나 인정할 수 있다. 함께 아름다운 경험을 나누며 관계의 정서적인 풍요를 더할 수 있다.", "underuse": "이 강점이 덜 드러날 때는 결과의 기능과 효율에 집중하면서 아름다움·완성도·탁월함이 주는 가치와 감동을 지나칠 수 있다.", "overuse": "지나치게 쓰이면 내용보다 형식과 완성도에 많은 에너지를 쓰거나, 높은 기준 때문에 평범하지만 충분한 결과를 인정하기 어려울 수 있다.", "balance": "아름다움과 완성도가 목적과 사용성에 어떻게 기여하는지 함께 살핀다. 탁월함을 감상하되 비교와 완벽주의로 이어지지 않도록 과정과 현실적인 기준도 인정한다."}}, {"code": "X02", "name": "감사", "virtue": "초월", "subtitle": "", "sections": {"core": "받은 도움과 삶의 긍정적인 부분을 당연하게 여기지 않고 고마움을 느끼고 표현하는 강점이다. 자신이 이룬 결과 안에서도 다른 사람과 환경의 기여를 알아보는 모습으로 나타난다.", "work": "도움·협력·배려를 구체적으로 알아보고 감사의 마음을 표현하는 모습으로 나타난다. 작은 진전과 지원을 인식해 서로의 기여가 보이는 분위기를 만드는 데 도움이 된다.", "relationship": "익숙한 관계에서도 상대가 해주는 일을 당연하게 여기지 않고 고마움을 표현할 수 있다. 어려운 시기에도 관계 안에 남아 있는 긍정적인 부분을 발견하는 데 도움이 된다.", "underuse": "이 강점이 덜 드러날 때는 도움과 좋은 결과를 익숙하거나 당연한 것으로 받아들여, 고마움과 기여가 충분히 표현되지 않을 수 있다.", "overuse": "지나치게 쓰이면 불편함이나 부당함이 있어도 좋은 점만 보려 하거나, 도움을 받았다는 이유로 필요 이상으로 빚진 마음을 가질 수 있다.", "balance": "고마운 점을 구체적으로 표현하면서도 필요한 문제와 요구는 별도로 다룬다. 감사와 의무감을 구분하고, 받은 도움을 자신의 방식으로 선순환시키되 무리하게 갚으려 하지 않는다."}}, {"code": "X03", "name": "희망", "virtue": "초월", "subtitle": "", "sections": {"core": "원하 <script>
/* ====================== 채점 로직 (한 곳에 고정) ====================== */

/* 역문항 응답 뒤집기: 1↔5, 2↔4, 3=3 */
function reverseScore(v) { return 6 - v; }

/* 응답(answers: {문항ID: 1~5}) → 강점별 평균 점수 {code: 평균} */
function computeScores(answers) {
  const byCode = {};
  QITEMS.forEach(function (q) {
    let v = answers[q.id];
    if (v == null) return;
    if (q.rev) v = reverseScore(v);
    if (!byCode[q.code]) byCode[q.code] = [];
    byCode[q.code].push(v);
  });
  const scores = {};
  Object.keys(byCode).forEach(function (code) {
    const arr = byCode[code];
    const sum = arr.reduce(function (a, b) { return a + b; }, 0);
    scores[code] = sum / arr.length; // 1~5
  });
  return scores;
}

/* 강점 점수 → 내림차순 정렬된 [{code, score}] */
function rankStrengths(scores) {
  return STRENGTHS
    .map(function (s) { return { code: s.code, score: scores[s.code] != null ? scores[s.code] : 0 }; })
    .sort(function (a, b) {
      if (b.score !== a.score) return b.score - a.score;
      return a.code < b.code ? -1 : 1; // 동점이면 코드순(안정적)
    });
}

/* 상위 5강점 코드 배열 */
function top5Codes(scores) {
  var r = rankStrengths(scores);
  if (r.length <= 5) return r.map(function (x) { return x.code; });
  // 5위 점수와 같은 강점은 모두 포함 (동점 강제 절단 방지)
  var cutScore = r[4].score;
  var out = [];
  for (var i = 0; i < r.length; i++) {
    if (i < 5 || r[i].score === cutScore) out.push(r[i].code);
    else break;
  }
  return out;
}

/* 5위와 6위가 근소차인지 (화면 안내용, 수치는 노출 안 함) */
const CLOSE_GAP = 0.25;
function isCloseAtCut(scores) {
  const r = rankStrengths(scores);
  if (r.length < 6) return false;
  return (r[4].score - r[5].score) <= CLOSE_GAP;
}

/* 경험확인 응답 → 라벨. checks[code] = [0~2, 0~2, 0~2, 0~2]
   합계로 3구간. 순위는 절대 바꾸지 않음. */
function checkLabel(arr) {
  if (!arr || arr.length < 4) return null;
  const sum = arr.reduce(function (a, b) { return a + b; }, 0); // 0~8
  if (sum >= 6) return { key: "core", text: "실제 경험과 연결이 높은 강점", color: "#3E7C5A" };
  if (sum >= 3) return { key: "grow", text: "경험과 어느 정도 연결된 강점", color: "#B0812E" };
  return { key: "explore", text: "경험 속에서 더 확인해 볼 강점", color: "#6E7B86" };
}

function strengthByCode(code) {
  for (let i = 0; i < STRENGTHS.length; i++)
    if (STRENGTHS[i].code === code) return STRENGTHS[i];
  return null;
}

/* API 헬퍼 */
async function api(action, payload) {
  if (!API_URL) throw new Error("API_URL이 설정되지 않았습니다.");
  const res = await fetch(API_URL, {
    method: "POST",
    body: JSON.stringify(Object.assign({ action: action }, payload || {}))
  });
  return res.json();
}
function sanitize(code) { return String(code || "").trim(); }
function makeId() {
  if (window.crypto && window.crypto.randomUUID) return window.crypto.randomUUID();
  return "r-" + Date.now() + "-" + Math.random().toString(36).slice(2, 10);
}
function sleep(ms) { return new Promise(function (res) { setTimeout(res, ms); }); }

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function shuffleSpread(arr) {
  function tooClose(list) {
    for (let i = 1; i < list.length; i++)
      if (list[i].code === list[i - 1].code) return true;
    return false;
  }
  let best = shuffle(arr);
  for (let attempt = 0; attempt < 40 && tooClose(best); attempt++) best = shuffle(arr);
  for (let i = 1; i < best.length; i++) {
    if (best[i].code === best[i - 1].code) {
      for (let j = i + 1; j < best.length; j++) {

    setErr("");
    if (!code.trim()) { setErr("진단코드를 입력해 주세요."); return; }
    if (!nick.trim()) { setErr("닉네임을 입력해 주세요."); return; }
    if (!agree) { setErr("결과 저장 안내에 동의해 주세요."); return; }
    setLoading(true);
    // 통신·서버 오류일 때만 최대 2회 자동 재시도. 정상 응답(미등록 코드)은 재시도 안 함.
    var attempts = 3; // 첫 시도 + 2회 재시도
    var lastErr = false;
    for (var i = 0; i < attempts; i++) {
      try {
        const r = await api("validate", { code: sanitize(code) });
        // 서버 오류({ok:false})나 응답 없음 → catch로 보내 재시도
        if (!r || r.ok !== true) throw new Error("server error");
        // 정상 통신: valid로 판단
        if (r.valid) {
          setLoading(false);
          props.onStart(sanitize(code), nick.trim());
          return;
        }
        // 정상 응답이지만 미등록 코드 → 재시도하지 않고 즉시 안내
        setLoading(false);
        setErr("등록되지 않은 진단코드입니다. 진행자에게 확인해 주세요.");
        return;
      } catch (e) {
        lastErr = true;
        if (i < attempts - 1) await sleep(500 + Math.floor(Math.random() * 1000));
      }

    [345,120,0.8,0], [60,150,0.9,1], [270,160,0.7,0], [160,120,1.4,1],
    [330,210,0.7,0], [30,230,0.8,0], [355,300,0.6,0], [20,400,0.7,0],
    [250,260,0.7,0], [90,330,0.6,0]
  ];
  const constellation = [[120,48],[160,120],[210,90],[60,150],[300,58]];
  const lines = [[120,48,160,120],[160,120,210,90],[160,120,60,150],[210,90,300,58]];

  return h("div", { style: { minHeight: "100vh", background: "#111A2E", position: "relative", overflow: "hidden" } },
    // 밤하늘 SVG
    h("svg", {
      style: { position: "absolute", top: 0, left: 0, width: "100%", height: "100%", pointerEvents: "none" },
      viewBox: "0 0 380 640", preserveAspectRatio: "xMidYMid slice", "aria-hidden": "true"
    },
      lines.map(function (l, i) {
        return h("line", { key: "l" + i, x1: l[0], y1: l[1], x2: l[2], y2: l[3],
          stroke: "#C9A24B", strokeWidth: 0.7, opacity: 0.5 });
      }),
      stars.map(function (s, i) {
        return h("circle", { key: "s" + i, cx: s[0], cy: s[1], r: s[2],

          style: s[3] ? { animationDelay: (i * 0.7) + "s" } : null });
      }),

      })
    ),
    // 내용
    h("div", { className: "wrap", style: { position: "relative", padding: "48px 18px 56px" } },
      h("div", { style: { fontSize: 11, letterSpacing: 3, color: "#B9903E", fontWeight: 600 } }, "STRENGTH DISCOVERY · 강점발견"),
      h("h1", { style: { fontSize: 26, lineHeight: 1.42, margin: "16px 0 0", fontWeight: 700, color: "#EEF1F7", letterSpacing: "-0.3px" } },
        h("span", { style: { color: "#D9B65E" } }, "강점"), "을 발견하고,", h("br"),
        "나만의 ", h("span", { style: { color: "#D9B65E" } }, "탁월함"), "을 깨우다"),
      h("p", { style: { fontSize: 14.5, lineHeight: 1.75, color: "#C3CAD8", marginTop: 16 } },
        "누구에게나 저마다의 방식으로 빛나는 24가지 성격강점이 있습니다. 최근의 경험을 돌아보며 자연스럽게 드러나는 강점을 발견하고, 나만의 탁월함으로 발전시킬 가능성을 찾아보세요."),

      h("div", { style: {
        marginTop: 26, background: "rgba(255,255,255,0.055)",
        border: "1px solid rgba(201,162,75,0.22)", borderRadius: 14, padding: "18px 16px"
      } },
        h("label", { htmlFor: "sd-code", style: labelStyle }, "진단코드"),

          }),
          h("span", { style: { fontSize: 12, lineHeight: 1.6, color: "#AEB6C4" } },
            "응답 결과(닉네임, 강점별 점수, 상위 강점과 경험 확인 응답, 제출 시각)는 진행자 확인을 위해 저장되며, 활동이 끝난 뒤 진행자가 삭제합니다. 이에 동의합니다.")
        )
      ),

      err ? h("div", { style: { color: "#F0A58C", fontSize: 14, marginTop: 14 } }, err) : null,

      h("div", { style: { marginTop: 18 } },
        h("button", {
          onClick: start, disabled: loading,
          style: {
            display: "block", width: "100%", padding: "15px", borderRadius: 12,
            fontSize: 16, fontWeight: 600, border: "none",
            background: loading ? "#B9A05A" : "#D9B65E", color: "#0E1626",

      h("div", { style: { marginTop: 22, fontSize: 11.5, color: "#8E96A6", lineHeight: 1.65 } },
        "약 10~12분 정도 걸립니다. 최근 6개월 동안 여러 상황에서 반복적으로 나타난 실제 모습을 기준으로, 되고 싶은 모습보다 지금의 나에 가까운 답을 골라 주세요."),

/* ---------- 문항 화면 ---------- */
const PER_PAGE = 6; // 한 화면 6문항

function QuizScreen(props) {
  const items = props.items; // 셔플된 96문항
  const [page, setPage] = useState(0);
  const [answers, setAnswers] = useState({});
  const totalPages = Math.ceil(items.length / PER_PAGE);
  const topRef = useRef(null);

  const pageItems = items.slice(page * PER_PAGE, page * PER_PAGE + PER_PAGE);
  const answeredOnPage = pageItems.filter(function (q) { return answers[q.id] != null; }).length;
  const pageComplete = answeredOnPage === pageItems.length;
  const totalAnswered = Object.keys(answers).length;

  useEffect(function () {
    if (topRef.current) topRef.current.scrollIntoView({ block: "start" });
    window.scrollTo(0, 0);
  }, [page]);

  function pick(id, val) {
    setAnswers(function (prev) {
      const n = Object.assign({}, prev); n[id] = val; return n;
    });
  }

  function next() {
    if (page < totalPages - 1) setPage(page + 1);
    else props.onDone(answers);
  }

  const SCALE = [
    { v: 1, t: "전혀\n아니다" }, { v: 2, t: "별로\n아니다" },
    { v: 3, t: "보통" }, { v: 4, t: "대체로\n그렇다" }, { v: 5, t: "매우\n그렇다" }
  ];

  return h("div", { className: "wrap", style: { padding: "26px 18px 40px" }, ref: topRef },
    h(Progress, {
      value: page + 1, max: totalPages,
      label: "구간 " + (page + 1) + " / " + totalPages + " · 응답 " + totalAnswered + "/" + items.length
    }),
    pageItems.map(function (q, idx) {
      const globalNo = page * PER_PAGE + idx + 1;
      const cur = answers[q.id];
      return h("div", {
        key: q.id,
        style: {
          background: "#fff", borderRadius: 14, padding: "18px 16px 14px",
          marginBottom: 14, border: "1px solid #E8EAE7"
        }
      },
        h("div", { style: { fontSize: 15.5, lineHeight: 1.55, fontWeight: 500, marginBottom: 14 } },
          h("span", { style: { color: "#B4B9B4", fontWeight: 700, marginRight: 7 } }, globalNo),
          q.text),
        h("div", { style: { display: "flex", gap: 6 } },
          SCALE.map(function (s) {
            const on = cur === s.v;
            return h("button", {
              key: s.v, onClick: function () { pick(q.id, s.v); },
              style: {
                flex: 1, padding: "10px 2px", borderRadius: 9,
                border: on ? "2px solid #3E6B52" : "1px solid #DADED9",
                background: on ? "#3E6B52" : "#fff",
                color: on ? "#fff" : "#6A716A",
                fontSize: 11.5, lineHeight: 1.25, whiteSpace: "pre-line", fontWeight: on ? 700 : 500
              }
            }, s.t);
          })
        )
      );
    }),
    h("div", { style: { marginTop: 20, display: "flex", gap: 10 } },
      page > 0 ? h("button", {
        onClick: function () { setPage(page - 1); },
        style: {
          flex: "0 0 90px", padding: "15px 0", borderRadius: 12, fontSize: 15,
          fontWeight: 600, background: "#EAEDE9", color: "#5A615A"
        }
      }, "이전") : null,
      h("div", { style: { flex: 1 } },
        h(Btn, { onClick: next, disabled: !pageComplete },
          !pageComplete ? "이 구간을 모두 응답해 주세요"
            : (page < totalPages - 1 ? "다음 구간" : "응답 완료")))
    )
  );
}

/* ---------- 경험 확인 화면 ---------- */
function CheckScreen(props) {
  const top5 = props.top5; // 코드 배열
  // checks[code] = [null×4]
  const [checks, setChecks] = useState(function () {
    const o = {}; top5.forEach(function (c) { o[c] = [null, null, null, null]; }); return o;
  });
  const topRef = useRef(null);

  useEffect(function () { window.scrollTo(0, 0); }, []);

  function set(code, i, val) {
    setChecks(function (prev) {
      const n = Object.assign({}, prev);
      n[code] = n[code].slice(); n[code][i] = val; return n;
    });
  }
  const allDone = top5.every(function (c) {
    return checks[c].every(function (v) { return v != null; });
  });

  return h("div", { className: "wrap", style: { padding: "26px 18px 40px" }, ref: topRef },
    h("h2", { style: { fontSize: 21, fontWeight: 700, margin: "0 0 8px" } }, "잠깐, 경험으로 확인해 볼까요?"),
    h("p", { style: { fontSize: 14.5, lineHeight: 1.6, color: "#5A615A", marginBottom: 8 } },
      "응답에서 상대적으로 두드러진 상위 강점입니다. 각 강점이 실제 경험과 얼마나 연결되는지 살펴보면, 결과를 더 정확하게 이해할 수 있습니다."),
    h("p", { style: { fontSize: 12.5, color: "#9AA09A", marginBottom: 20 } },
      "이 응답은 강점 순위를 바꾸지 않습니다. 실제 경험과의 연결 정도만 함께 보여드립니다."),

    top5.map(function (code, idx) {
      const s = strengthByCode(code);
      const color = VIRTUE_COLOR[s.virtue] || "#3E6B52";
      return h("div", {
        key: code,
        style: { background: "#fff", borderRadius: 14, padding: "16px 15px",
          marginBottom: 14, border: "1px solid #E8EAE7" }
      },
        h("div", { style: { display: "flex", alignItems: "baseline", gap: 8, marginBottom: 12 } },
          h("span", { style: { fontSize: 12, fontWeight: 700, color: color } }, "강점 " + (idx + 1)),
          h("span", { style: { fontSize: 17, fontWeight: 700 } }, s.name)
        ),
        CHECK_LABELS.map(function (cl, i) {
          return h("div", { key: cl.key, style: { marginBottom: 11 } },
            h("div", { style: { fontSize: 13.5, color: "#4A514A", marginBottom: 6, lineHeight: 1.45 } }, cl.q),
            h("div", { style: { display: "flex", gap: 6 } },
              CHECK_OPTIONS.map(function (opt, ov) {
                const on = checks[code][i] === ov;
                return h("button", {
                  key: ov, onClick: function () { set(code, i, ov); },
                  style: {
                    flex: 1, padding: "8px 2px", borderRadius: 8, fontSize: 12.5,
                    border: on ? ("2px solid " + color) : "1px solid #DADED9",
                    background: on ? color : "#fff", color: on ? "#fff" : "#6A716A",
                    fontWeight: on ? 700 : 500
                  }
                }, opt);
              })
            )
          );
        })
      );
    }),

    h("div", { style: { marginTop: 18 } },
      h(Btn, { onClick: function () { props.onDone(checks); }, disabled: !allDone },
        allDone ? "결과 보기" : "모든 항목에 응답해 주세요"))
  );
}

/* ---------- 결과 화면 ---------- */
const SECTION_ORDER = [
  { key: "core", label: "이 강점의 핵심" },
  { key: "work", label: "직장에서의 모습" },
  { key: "relationship", label: "관계에서의 모습" },
  { key: "underuse", label: "덜 드러날 때" },
  { key: "overuse", label: "지나치게 쓰일 때" },
  { key: "balance", label: "균형 있게 활용하는 법" }
];

function ResultScreen(props) {
  const scores = props.scores;
  const top5 = props.top5;
  const checks = props.checks;
  const ranked = useMemo(function () { return rankStrengths(scores); }, [scores]);
  const close = useMemo(function () { return isCloseAtCut(scores); }, [scores]);
  // 상위 강점과 동점인 강점이 더 있는지 (6개 상한으로 잘렸을 수 있음)
  const hasHiddenTie = useMemo(function () {
    if (!top5 || !top5.length) return false;
    var lastCode = top5[top5.length - 1];
    var lastScore = scores[lastCode];
    var count = 0;
    for (var i = 0; i < ranked.length; i++) if (ranked[i].score === lastScore) count++;
    // 마지막 상위강점과 같은 점수인 강점이 top5에 안 든 게 있으면 true
    return count > top5.filter(function (c) { return scores[c] === lastScore; }).length;
  }, [top5, scores, ranked]);
  const [openCode, setOpenCode] = useState(top5[0]);
  const [showAll, setShowAll] = useState(false);
  const [saved, setSaved] = useState(false);
  const [saving, setSaving] = useState(false);
  const [saveError, setSaveError] = useState(false);
  const savingRef = useRef(false);

  const ridRef = useRef(null);
  if (ridRef.current === null) ridRef.current = makeId(); // 한 번만 생성, 재시도에도 동일

  async function attemptSave() {
    // 같은 responseId로 저장 → 서버가 중복이면 갱신
    const r = await api("save", {
      code: props.code, nick: props.nick, responseId: ridRef.current,
      scores: scores, top5: top5, checks: checks
    });
    return r && r.ok;
  }

  async function save(isManual) {
    if (savingRef.current || saved) return;
    savingRef.current = true;
    setSaving(true); setSaveError(false);
    // 첫 시도는 즉시. 실패하면 1s·3s·6s(+무작위) 간격으로 최대 3회 자동 재시도.
    const delays = [1000, 3000, 6000];
    let ok = false;
    for (let attempt = 0; attempt <= delays.length; attempt++) {
      try {
        ok = await attemptSave();
        if (ok) break;
      } catch (e) { ok = false; }
      if (attempt < delays.length) {
        await sleep(delays[attempt] + Math.floor(Math.random() * 800));
      }
    }
    if (ok) setSaved(true); else setSaveError(true);
    setSaving(false);
    savingRef.current = false;
  }
  useEffect(function () { save(false); }, []);

  return h("div", { className: "wrap", style: { padding: "30px 18px 60px" } },
    h("div", { style: { fontSize: 12, letterSpacing: 3, color: "#8A918A", fontWeight: 600 } }, "나의 강점발견"),
    h("h1", { style: { fontSize: 23, fontWeight: 700, margin: "8px 0 4px" } }, props.nick + " 님의 대표 강점"),
    h("p", { style: { fontSize: 13.5, color: "#7A817A", marginBottom: 4 } },
      "나답게 발휘되는 강점과 활용 방향입니다."),
    saved ? h("div", { style: { fontSize: 12, color: "#3E7C5A", marginBottom: 20 } }, "✓ 결과가 저장되었습니다")
      : saveError ? h("div", { style: { marginBottom: 20, padding: 12, background: "#F5EAE6", borderRadius: 10 } },
          h("div", { style: { fontSize: 13, color: "#B0492E", marginBottom: 8 } }, "결과가 아직 저장되지 않았습니다."),
          h("button", { onClick: function () { save(true); }, disabled: saving,
            style: { padding: "8px 16px", borderRadius: 8, background: "#3E6B52", color: "#fff", fontSize: 13, fontWeight: 600 } },
            saving ? "저장 중…" : "다시 저장하기"))
      : h("div", { style: { fontSize: 12, color: "#9AA09A", marginBottom: 20 } }, saving ? "저장 중…" : ""),

    /* 상위 5강점 카드 */
    top5.map(function (code, idx) {
      const s = strengthByCode(code);
      const color = VIRTUE_COLOR[s.virtue] || "#3E6B52";
      const lab = checkLabel(checks && checks[code]);
      const open = openCode === code;
      return h("div", {
        key: code,
        style: { background: "#fff", borderRadius: 14, marginBottom: 12,
          border: "1px solid #E8EAE7", overflow: "hidden" }
      },
        h("button", {
          onClick: function () { setOpenCode(open ? null : code); },
          style: { width: "100%", textAlign: "left", background: "none",
            padding: "16px 16px", display: "flex", alignItems: "center", gap: 12 }
        },
          h("div", { style: {
            flex: "0 0 30px", height: 30, borderRadius: 8, background: color,
            color: "#fff", fontWeight: 700, fontSize: 15,
            display: "flex", alignItems: "center", justifyContent: "center"
          } }, idx + 1),
          h("div", { style: { flex: 1 } },
            h("div", { style: { fontSize: 17, fontWeight: 700 } }, s.name),
            s.subtitle ? h("div", { style: { fontSize: 12, color: "#8A918A", marginTop: 1 } }, s.subtitle) : null,
            lab ? h("div", { style: { fontSize: 12, color: lab.color, fontWeight: 600, marginTop: 3 } }, lab.text) : null
          ),
          h("div", { style: { color: "#B4B9B4", fontSize: 13 } }, open ? "▲" : "▼")
        ),
        open ? h("div", { style: { padding: "0 16px 18px" } },
          SECTION_ORDER.map(function (sec) {
            const txt = s.sections[sec.key];
            if (!txt) return null;
            return h("div", { key: sec.key, style: { marginTop: 14 } },
              h("div", { style: { fontSize: 12.5, fontWeight: 700, color: color, marginBottom: 4 } }, sec.label),
              h("div", { style: { fontSize: 14, lineHeight: 1.62, color: "#3E453E" } }, txt)
            );
          })
        ) : null
      );
    }),

    close ? h("div", { style: {
      marginTop: 4, marginBottom: 8, padding: 13, background: "#EEF1ED",
      borderRadius: 10, fontSize: 12.5, lineHeight: 1.55, color: "#5A615A"
    } }, "상위 강점들의 점수 차이가 크지 않습니다. 순위 자체보다, 이 강점들이 실제 경험에서 어떻게 나타나는지 살펴보는 것이 더 중요합니다.") : null,

    hasHiddenTie ? h("div", { style: {
      marginBottom: 8, padding: 13, background: "#EEF1ED",
      borderRadius: 10, fontSize: 12.5, lineHeight: 1.55, color: "#5A615A"

  );
}

/* ---------- 결과 PNG ---------- */
function downloadResultPNG(nick, top5, checks) {
  const W = 720, pad = 48;
  const cv = document.createElement("canvas");
  const dpr = 2; cv.width = W * dpr;
  const lineH = 92;
  const H = 340 + top5.length * lineH + 120;
  cv.height = H * dpr;
  const ctx = cv.getContext("2d");
  ctx.scale(dpr, dpr);

  ctx.fillStyle = "#F5F6F4"; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = "#8A918A"; ctx.font = "600 15px sans-serif";
  ctx.fillText("강 점 발 견", pad, 60);
  ctx.fillStyle = "#2A2E2A"; ctx.font = "700 30px sans-serif";
  ctx.fillText(nick + " 님의 대표 강점", pad, 104);
  ctx.fillStyle = "#7A817A"; ctx.font = "400 15px sans-serif";
  ctx.fillText("일상 속에 이미 있는 나의 강점", pad, 134);

  let y = 196;
  top5.forEach(function (code, idx) {
    const s = strengthByCode(code);
    const color = VIRTUE_COLOR[s.virtue] || "#3E6B52";
    const lab = checkLabel(checks && checks[code]);
    // 번호 박스
    ctx.fillStyle = color; roundRect(ctx, pad, y - 26, 40, 40, 9); ctx.fill();
    ctx.fillStyle = "#fff"; ctx.font = "700 20px sans-serif";
    ctx.textAlign = "center"; ctx.fillText(idx + 1, pad + 20, y + 1);
    ctx.textAlign = "left";
    // 강점명
    ctx.fillStyle = "#2A2E2A"; ctx.font = "700 24px sans-serif";
    ctx.fillText(s.name, pad + 58, y - 2);
    if (s.subtitle) {
      ctx.fillStyle = "#8A918A"; ctx.font = "400 14px sans-serif";
      ctx.fillText(s.subtitle, pad + 58, y + 20);
    }
    if (lab) {
      ctx.fillStyle = lab.color; ctx.font = "600 14px sans-serif";
      ctx.fillText(lab.text, pad + 58, s.subtitle ? y + 40 : y + 22);
    }
    y += lineH;
  });

  ctx.fillStyle = "#9AA09A"; ctx.font = "400 12px sans-serif";
  wrapText(ctx, "이 결과는 개인 내 강점 프로필입니다. 자기이해와 성장을 위한 자료로 활용하며, 평가나 선발을 위한 것이 아닙니다.", pad, y + 10, W - pad * 2, 18);

  const filename = "강점발견_" + nick + ".png";
  cv.toBlob(function (blob) {
    const file = new File([blob], filename, { type: "image/png" });
    if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
      navigator.share({ files: [file], title: "강점발견 결과" }).catch(function () { dl(); });
    } else { dl(); }
    function dl() {
      const a = document.createElement("a");
      a.download = filename; a.href = cv.toDataURL("image/png"); a.click();
    }
  });
}
function roundRect(ctx, x, y, w, hh, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + hh, r);
  ctx.arcTo(x + w, y + hh, x, y + hh, r); ctx.arcTo(x, y + hh, x, y, r);
  ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function wrapText(ctx, text, x, y, maxW, lh) {
  const words = text.split(""); let line = "";
  for (let i = 0; i < words.length; i++) {
    const test = line + words[i];
    if (ctx.measureText(test).width > maxW) { ctx.fillText(line, x, y); line = words[i]; y += lh; }
    else line = test;
  }
  ctx.fillText(line, x, y);
}

/* ---------- 관리자 화면 ---------- */
function AdminScreen(props) {
  const [pw, setPw] = useState("");
  const [authed, setAuthed] = useState(false);
  const [pwErr, setPwErr] = useState("");
  const [codes, setCodes] = useState([]);
  const [newCode, setNewCode] = useState("");
  const [sel, setSel] = useState("");
  const [rows, setRows] = useState(null);
  const [loading, setLoading] = useState(false);
  const [err, setErr] = useState("");
  const [openId, setOpenId] = useState(null);

  async function login() {
    setPwErr(""); setLoading(true);
    try {
      const r = await api("adminAuth", { pw: pw });
      if (r.ok && r.authed) { setAuthed(true); loadCodes(); }
      else setPwErr("비밀번호가 올바르지 않습니다.");
    } catch (e) { setPwErr("연결에 문제가 있습니다."); }
    setLoading(false);
  }

  async function loadCodes() {
    try {
      const r = await api("codesList", { pw: pw });
      if (r.ok) setCodes(r.codes || []);
    } catch (e) { setErr("코드 목록을 불러오지 못했습니다."); }
  }

  async function addCode() {
    const c = newCode.trim(); if (!c) return;
    setErr("");
    try {
      const r = await api("codesAdd", { pw: pw, code: c });
      if (r.ok) { setNewCode(""); loadCodes(); }
      else if (r.error === "exists") setErr("이미 등록된 코드입니다.");
      else setErr("코드 추가에 실패했습니다.");
    } catch (e) { setErr("코드 추가 중 오류가 발생했습니다."); }
  }

  async function removeCode(c) {
    if (!window.confirm("진단코드 '" + c + "' 을(를) 삭제할까요? (응답 결과는 별도로 남습니다)")) return;
    try {
      await api("codesRemove", { pw: pw, code: c });
      if (sel === c) { setSel(""); setRows(null); }
      loadCodes();
    } catch (e) { setErr("코드 삭제에 실패했습니다."); }
  }

  async function openCode(c) {
    setSel(c); setRows(null); setLoading(true); setErr(""); setOpenId(null);
    try {
      const r = await api("list", { pw: pw, code: c });
      if (r.ok) setRows(r.rows || []);
      else setErr("결과를 불러오지 못했습니다.");
    } catch (e) { setErr("결과를 불러오지 못했습니다."); }
    setLoading(false);
  }

  async function delOne(rid, nick) {
    if (!window.confirm("'" + nick + "' 님의 결과를 삭제할까요?")) return;
    try {
      const r = await api("delete", { pw: pw, responseId: rid });
      if (r && r.ok) {
        setRows(function (prev) { return prev.filter(function (x) { return x.responseId !== rid; }); });
      } else { setErr("삭제에 실패했습니다."); }
    } catch (e) { setErr("삭제에 실패했습니다."); }
  }

  async function delAll() {
    if (!rows || !rows.length) return;
    if (!window.confirm("진단코드 '" + sel + "' 의 결과 " + rows.length + "건을 모두 삭제할까요? 삭제 후에는 복구할 수 없습니다.")) return;
    try {
      const r = await api("deleteAll", { pw: pw, code: sel });
      if (r && r.ok) { setRows([]); }
      else { setErr("삭제에 실패했습니다."); }
    } catch (e) { setErr("일부 삭제에 실패했습니다."); }
  }

  /* 그룹 집계: 각 강점이 상위5에 포함된 인원 */
  const groupAgg = useMemo(function () {
    if (!rows || !rows.length) return null;
    const cnt = {}; STRENGTHS.forEach(function (s) { cnt[s.code] = 0; });
    rows.forEach(function (r) {
      (r.top5 || []).forEach(function (c) { if (cnt[c] != null) cnt[c]++; });
    });
    const arr = STRENGTHS.map(function (s) {
      return { code: s.code, name: s.name, virtue: s.virtue, count: cnt[s.code] };
    }).filter(function (x) { return x.count > 0; })
      .sort(function (a, b) { return b.count - a.count; });
    return arr;
  }, [rows]);

  function exportCSV() {
    if (!rows || !rows.length) return;
    const header = ["닉네임", "제출시각"].concat(STRENGTHS.map(function (s) { return s.name; }));
    const lines = [header.join(",")];
    rows.forEach(function (r) {
      const d = new Date(r.ts);
      const ds = d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()) + " " + pad2(d.getHours()) + ":" + pad2(d.getMinutes());
      const row = [csvCell(r.nick), ds];
      STRENGTHS.forEach(function (s) {
        const v = r.scores && r.scores[s.code] != null ? r.scores[s.code].toFixed(2) : "";
        row.push(v);
      });
      lines.push(row.join(","));
    });
    const blob = new Blob(["\uFEFF" + lines.join("\n")], { type: "text/csv;charset=utf-8" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "강점발견_" + sel + ".csv"; a.click();
  }
  function pad2(n) { return n < 10 ? "0" + n : "" + n; }
  function csvCell(s) {
    s = String(s || "");
    if (/^[=+\-@\t\r]/.test(s)) s = "'" + s;
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }

  const inputStyle = {
    padding: "11px 12px", fontSize: 15, borderRadius: 9,
    border: "1px solid #D2D6D1", background: "#fff"
  };

  /* 로그인 전 */
  if (!authed) {
    return h("div", { className: "wrap", style: { padding: "60px 18px" } },
      h("button", { onClick: props.onBack, style: { background: "none", color: "#B4B9B4", fontSize: 13, marginBottom: 30 } }, "← 처음으로"),
      h("h2", { style: { fontSize: 20, fontWeight: 700, marginBottom: 20 } }, "진행자 페이지"),
      h("input", {
        type: "password", value: pw, placeholder: "비밀번호", style: Object.assign({ width: "100%" }, inputStyle),
        onChange: function (e) { setPw(e.target.value); },
        onKeyDown: function (e) { if (e.key === "Enter") login(); }
      }),
      pwErr ? h("div", { style: { color: "#C0492E", fontSize: 13, marginTop: 10 } }, pwErr) : null,
      h("div", { style: { marginTop: 16 } }, h(Btn, { onClick: login, disabled: loading }, loading ? "확인 중…" : "로그인"))
    );
  }

  /* 로그인 후 */
  return h("div", { className: "wrap", style: { padding: "26px 18px 60px" } },
    h("div", { style: { display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 22 } },
      h("h2", { style: { fontSize: 19, fontWeight: 700 } }, "진행자 페이지"),
      h("button", { onClick: props.onBack, style: { background: "none", color: "#B4B9B4", fontSize: 13 } }, "나가기")
    ),

    h("div", { style: { padding: "11px 13px", background: "#F3F0E7", borderRadius: 10, fontSize: 12, lineHeight: 1.55, color: "#7A6E52", marginBottom: 18 } },
      "개인정보 보호를 위해, 활동이 끝나면 참가자 결과를 삭제해 주세요. 아래 각 코드의 결과에서 개별 삭제 또는 전체삭제를 사용할 수 있습니다."),

    /* 진단코드 관리 */
    h("div", { style: { background: "#fff", borderRadius: 12, padding: 16, marginBottom: 18, border: "1px solid #E8EAE7" } },
      h("div", { style: { fontSize: 14, fontWeight: 700, marginBottom: 12 } }, "진단코드"),
      h("div", { style: { display: "flex", gap: 8, marginBottom: 12 } },
        h("input", {
          value: newCode, placeholder: "예: HD0715 (문자+숫자 권장)",
          style: Object.assign({ flex: 1 }, inputStyle),
          onChange: function (e) { setNewCode(e.target.value); },
          onKeyDown: function (e) { if (e.key === "Enter") addCode(); }
        }),
        h("button", { onClick: addCode, style: { padding: "0 18px", borderRadius: 9, background: "#3E6B52", color: "#fff", fontWeight: 600, fontSize: 14 } }, "추가")
      ),
      codes.length === 0 ? h("div", { style: { fontSize: 13, color: "#9AA09A" } }, "등록된 코드가 없습니다.")
        : h("div", { style: { display: "flex", flexWrap: "wrap", gap: 8 } },
          codes.map(function (c) {

            } },
              h("button", { onClick: function () { openCode(c); }, style: { background: "none", color: "inherit", fontWeight: 600, fontSize: 13.5 } }, c),
              h("button", { onClick: function () { removeCode(c); }, style: { background: "none", color: on ? "#CFE3D6" : "#B4B9B4", fontSize: 15, lineHeight: 1 } }, "×")
            );
          })
        )
    ),

    err ? h("div", { style: { color: "#C0492E", fontSize: 13, marginBottom: 14 } }, err) : null,
    loading ? h("div", { style: { fontSize: 14, color: "#9AA09A", padding: 20, textAlign: "center" } }, "불러오는 중…") : null,

    /* 결과 */
    (sel && rows) ? h("div", null,

        h("div", { style: { fontSize: 15, fontWeight: 700 } }, "'" + sel + "' 응답 " + rows.length + "명"),

        ) : null

      rows.length === 0 ? h("div", { style: { fontSize: 13.5, color: "#9AA09A", padding: "10px 0" } }, "아직 응답이 없습니다.") : null,

  );

/* ---------- 앱 루트 ---------- */
function App() {
  const [screen, setScreen] = useState("start"); // start, quiz, check, result, admin
  const [code, setCode] = useState("");
  const [nick, setNick] = useState("");
  const [items] = useState(function () { return shuffleSpread(QITEMS); });
  const [answers, setAnswers] = useState(null);
  const [scores, setScores] = useState(null);
  const [top5, setTop5] = useState(null);
  const [checks, setChecks] = useState(null);

  function onStart(c, n) { setCode(c); setNick(n); setScreen("quiz"); }

  function onQuizDone(ans) {
    const sc = computeScores(ans);
    var t5 = top5Codes(sc);
    if (t5.length > 6) t5 = t5.slice(0, 6); // 동점이 매우 많을 때 상한(경험확인·저장 안정)
    setAnswers(ans); setScores(sc); setTop5(t5); setScreen("check");
  }

  function onCheckDone(chk) { setChecks(chk); setScreen("result"); }

  // 진단 진행 중(문항/경험확인) 새로고침·창닫기 경고
  useEffect(function () {
    var risky = (screen === "quiz" || screen === "check");
    function warn(e) { e.preventDefault(); e.returnValue = ""; return ""; }
    if (risky) window.addEventListener("beforeunload", warn);
    return function () { window.removeEventListener("beforeunload", warn); };
  }, [screen]);

  if (screen === "admin")
    return h(AdminScreen, { onBack: function () { setScreen("start"); } });
  if (screen === "quiz")
    return h(QuizScreen, { items: items, onDone: onQuizDone });
  if (screen === "check")
    return h(CheckScreen, { top5: top5, onDone: onCheckDone });
  if (screen === "result")
    return h(ResultScreen, { code: code, nick: nick, scores: scores, top5: top5, checks: checks, saved: false });
  return h(StartScreen, { onStart: onStart, onAdmin: function () { setScreen("admin"); } });
}

ReactDOM.createRoot(document.getElementById("root")).render(h(App));

</script>
</body>
</html>
