const STRENGTHS=[{"code": "W01", "name": "창의성", "virtue": "지혜", "subtitle": "", "sections": {"core": "기존 방식에 머무르지 않고 새로운 관점과 방법을 떠올리는 강점이다. 단순히 특이한 생각을 내는 데 그치지 않고, 상황에 도움이 되는 방식으로 아이디어를 연결하고 발전시키는 모습으로 나타난다.", "work": "익숙한 업무에서도 개선할 점을 찾고 여러 해결 방법을 제안하는 모습으로 나타난다. 막힌 문제를 다른 각도에서 바라보거나 기존 자원을 새롭게 조합해 대안을 만들 수 있다.", "relationship": "상대와의 차이를 문제로만 보기보다 새로운 이해 방식이나 해결책을 찾는 데 도움이 된다. 함께 무언가를 할 때 색다른 아이디어를 보태 관계에 활기를 줄 수 있다.", "underuse": "이 강점이 덜 드러날 때는 익숙하고 검증된 방식에 의지해 안정적으로 처리하는 대신, 새로운 대안을 충분히 탐색하지 않을 수 있다.", "overuse": "지나치게 쓰이면 실현 가능성을 검토하기 전에 아이디어가 계속 늘어나거나, 이미 효과적인 방식까지 불필요하게 바꾸려 할 수 있다.", "balance": "아이디어를 낸 뒤 목적·효과·실행 가능성을 함께 확인한다. 새로운 시도와 기존 방식의 장점을 비교하고, 작게 시험한 뒤 확대하면 창의성을 현실적인 변화로 연결할 수 있다."}, "def": "기존 방식에 머무르지 않고 상황에 도움이 되는 새로운 관점과 방법을 만들어 내는 강점입니다.", "short": "새로운 관점과 방법을 만들어 내는 힘"}, {"code": "W02", "name": "호기심", "virtue": "지혜", "subtitle": "", "sections": {"core": "낯선 대상에서 궁금한 점을 발견하고 직접 알아보려는 강점이다. 주어진 정보에 머무르지 않고 질문하고 탐색하면서 이해의 범위를 넓히는 모습으로 나타난다.", "work": "새로운 업무나 변화의 배경을 궁금해하고 필요한 정보를 자발적으로 찾는 모습으로 나타난다. 당연하게 여겨 온 절차에도 질문을 던져 놓치고 있던 가능성을 발견할 수 있다.", "relationship": "상대의 생각과 경험에 관심을 갖고 질문하면서 서로를 더 깊이 이해하는 데 도움이 된다. 다양한 관점을 접할 때 판단보다 탐색을 먼저 할 수 있다.", "underuse": "이 강점이 덜 드러날 때는 현재 알고 있는 정보와 익숙한 경험을 중심으로 판단해, 새로운 정보나 관점을 접할 기회가 줄어들 수 있다.", "overuse": "지나치게 쓰이면 핵심 목적과 직접 관련 없는 정보까지 계속 탐색하거나, 상대가 부담스러울 만큼 질문이 많아질 수 있다.", "balance": "무엇을 왜 알고 싶은지 먼저 정하고, 필요한 탐색 범위와 시간을 정한다. 관계에서는 질문만 이어가기보다 자신의 생각도 나누고 상대가 답하고 싶은 범위를 존중한다."}, "def": "낯선 대상에서 궁금한 점을 발견하고 질문과 탐색을 통해 이해를 넓히는 강점입니다.", "short": "궁금한 것을 발견하고 탐색하는 힘"}, {"code": "W03", "name": "판단력", "virtue": "지혜", "subtitle": "", "sections": {"core": "여러 정보와 관점을 열린 태도로 검토한 뒤 근거에 따라 결론을 내리는 강점이다. 처음의 생각을 고집하기보다 새로운 정보가 충분하면 판단을 조정하는 모습으로 나타난다.", "work": "사실과 의견을 구분하고, 결정 전에 근거와 반대 관점을 함께 살피는 모습으로 나타난다. 성급한 결론을 줄이고 선택의 타당성을 높이는 데 도움이 된다.", "relationship": "한쪽 이야기만 듣고 단정하기보다 각자의 입장과 상황을 확인하려는 태도로 나타난다. 감정적인 순간에도 사실과 해석을 나누어 대화를 이어갈 수 있다.", "underuse": "이 강점이 덜 드러날 때는 처음 받은 정보나 익숙한 관점에 영향을 받아 충분한 검토 전에 결론을 내릴 수 있다.", "overuse": "지나치게 쓰이면 모든 근거가 충분해질 때까지 판단을 미루거나, 상대의 감정보다 논리적 타당성을 먼저 따질 수 있다.", "balance": "결정의 중요도에 맞춰 필요한 근거 수준과 검토 시간을 정한다. 논리적 판단과 함께 사람에게 미칠 영향도 살피고, 충분한 정보가 모이면 결론을 행동으로 옮긴다."}, "def": "여러 정보와 관점을 열린 태도로 검토하고 근거에 따라 판단을 내리거나 조정하는 강점입니다.", "short": "근거와 다양한 관점을 검토해 판단하는 힘"}, {"code": "W04", "name": "학구열", "virtue": "지혜", "subtitle": "", "sections": {"core": "새로운 지식과 기술을 배우고 깊이 익히는 과정에서 만족을 느끼는 강점이다. 단순히 정보를 모으는 데 그치지 않고 이해하고 숙달하려는 모습으로 나타난다.", "work": "필요한 전문성을 스스로 보완하고, 새롭게 배운 내용을 업무에 적용하는 모습으로 나타난다. 변화하는 환경에서도 학습을 통해 적응의 기반을 만들 수 있다.", "relationship": "자신이 알지 못하는 경험과 관점을 배우려는 태도가 관계의 폭을 넓힌다. 배운 내용을 나누어 서로의 성장에 기여할 수 있다.", "underuse": "이 강점이 덜 드러날 때는 당장 필요한 수준에서 업무를 처리하며, 지식이나 기술을 더 깊게 확장할 기회가 줄어들 수 있다.", "overuse": "지나치게 쓰이면 충분히 배운 뒤에야 시작하려 하거나, 학습 자체에 몰두해 실제 적용이 늦어질 수 있다.", "balance": "배울 내용과 실제 해결할 과제를 연결한다. 완벽히 익히기를 기다리기보다 작은 단위로 적용하고, 실행에서 얻은 반응을 다시 학습으로 이어간다."}, "def": "지식이나 기술을 깊이 배우고 익혀 새로운 상황에 적용하려는 강점입니다.", "short": "배움을 깊이 익혀 실제에 적용하는 힘"}, {"code": "W05", "name": "통찰", "virtue": "지혜", "subtitle": "", "sections": {"core": "흩어진 정보와 경험을 연결해 전체 흐름과 핵심 의미를 파악하는 강점이다. 눈앞의 현상만 보기보다 그 배경과 앞으로의 영향을 함께 바라보는 모습으로 나타난다.", "work": "복잡한 상황에서 핵심 쟁점을 정리하고, 현재의 선택이 장기적으로 어떤 영향을 줄지 살피는 모습으로 나타난다. 여러 의견을 더 큰 맥락 안에서 연결해 방향을 제시할 수 있다.", "relationship": "상대의 말 한마디보다 반복되는 상황과 관계의 흐름을 함께 살피는 데 도움이 된다. 당장의 갈등을 넘어 서로에게 중요한 것이 무엇인지 발견할 수 있다.", "underuse": "이 강점이 덜 드러날 때는 개별 정보와 당장의 과제에 집중해 전체 맥락이나 장기적인 의미를 놓칠 수 있다.", "overuse": "지나치게 쓰이면 충분한 확인 없이 숨은 의미를 앞서 해석하거나, 큰 그림을 강조하다 구체적인 현실을 놓칠 수 있다.", "balance": "발견한 핵심과 맥락을 구체적인 사실로 다시 확인한다. 큰 방향을 제시할 때는 바로 실행할 수 있는 다음 행동까지 함께 정리한다."}, "def": "복잡한 정보의 연결과 핵심을 파악해 전체 흐름과 의미를 바라보는 강점입니다.", "short": "연결과 핵심을 파악해 전체를 보는 힘"}, {"code": "C01", "name": "용기", "virtue": "용기", "subtitle": "", "sections": {"core": "두려움·부담·반대가 있더라도 필요하고 중요하다고 판단한 행동을 선택하는 강점이다. 두려움이 없는 상태가 아니라, 두려움 속에서도 한 걸음 내딛는 모습으로 나타난다.", "work": "말하기 어려운 문제를 제기하거나, 책임 있는 선택이 필요할 때 의견을 표현하는 모습으로 나타난다. 실패 가능성이 있어도 충분히 검토한 시도를 시작할 수 있다.", "relationship": "불편함을 피하기보다 필요한 이야기를 정중하게 꺼내고, 소중한 관계를 위해 솔직한 대화를 시도하는 데 도움이 된다. 부당한 상황에서 자신의 기준을 표현할 수도 있다.", "underuse": "이 강점이 덜 드러날 때는 부담이나 비판이 예상되는 상황에서 필요한 말과 행동을 미루며 안전한 선택을 우선할 수 있다.", "overuse": "지나치게 쓰이면 위험과 영향을 충분히 살피지 않고 맞서거나, 솔직함을 이유로 상대의 준비 상태를 고려하지 않을 수 있다.", "balance": "행동하기 전에 지키려는 가치와 감수할 위험을 함께 확인한다. 용기를 내되 표현 방식과 시점을 조절하고, 필요한 지원과 대비책을 마련한다."}, "def": "두려움·부담·반대가 있더라도 중요하고 필요하다고 판단한 말과 행동을 선택하는 강점입니다.", "short": "두려움 속에서도 필요한 행동을 선택하는 힘"}, {"code": "C02", "name": "끈기", "virtue": "용기", "subtitle": "", "sections": {"core": "장애와 지연이 있어도 목표를 향한 노력을 이어가고 시작한 일을 마무리하려는 강점이다. 결과가 바로 보이지 않을 때도 다시 시도하며 지속하는 모습으로 나타난다.", "work": "예상보다 일이 어렵거나 시간이 걸려도 필요한 과정을 이어가는 모습으로 나타난다. 중간의 실패를 최종 결론으로 여기지 않고 다시 시도해 결과를 만들어 낼 수 있다.", "relationship": "관계가 일시적으로 어려워져도 한 번의 갈등만으로 포기하지 않고 필요한 노력을 이어가는 데 도움이 된다. 약속한 관심과 지원을 꾸준히 보여줄 수 있다.", "underuse": "이 강점이 덜 드러날 때는 성과가 늦거나 장애가 생기면 노력의 방향을 유지하기 어려워지고, 시작한 일이 중간에 멈출 수 있다.", "overuse": "지나치게 쓰이면 이미 효과가 낮아진 목표나 방법을 놓지 못하고, 쉬거나 방향을 바꿔야 할 때도 계속 밀어붙일 수 있다.", "balance": "지속할 가치가 있는 목표인지 주기적으로 확인하고, 목표와 방법을 구분한다. 목표는 유지하되 방법은 바꿀 수 있으며, 회복을 위한 휴식도 지속의 일부로 본다."}, "def": "장애와 지연이 있어도 목표를 향한 노력을 이어가고 시작한 일을 마무리하는 강점입니다.", "short": "어려움 속에서도 목표를 향해 계속하는 힘"}, {"code": "C03", "name": "정직성", "virtue": "용기", "subtitle": "", "sections": {"core": "자신을 과장하거나 가장하지 않고 생각·말·행동을 가능한 한 일치시키는 강점이다. 실수와 한계를 감추기보다 사실대로 인정하고 책임 있게 설명하는 모습으로 나타난다.", "work": "모르는 것을 아는 척하지 않고, 실수나 진행 상황을 사실에 가깝게 공유하는 모습으로 나타난다. 사람이나 상황에 따라 핵심 원칙을 쉽게 바꾸지 않아 신뢰를 만드는 데 도움이 된다.", "relationship": "속마음을 무조건 숨기거나 꾸미기보다 관계에 필요한 진실을 솔직하게 나누는 데 도움이 된다. 말과 행동의 일관성이 상대에게 예측 가능성과 안정감을 줄 수 있다.", "underuse": "이 강점이 덜 드러날 때는 좋게 보이거나 갈등을 피하기 위해 실제 생각과 다른 태도를 보이며, 말과 행동 사이에 간격이 생길 수 있다.", "overuse": "지나치게 쓰이면 모든 생각을 그대로 말하는 것이 정직하다고 여기거나, 상대의 상황과 감정을 고려하지 않은 표현이 될 수 있다.", "balance": "사실을 숨기지 않되 무엇을 언제 어떻게 말할지 함께 고려한다. 솔직함의 목적을 분명히 하고, 상대를 존중하는 표현과 자신의 행동에 대한 책임을 더한다."}, "def": "사실을 숨기거나 자신을 과장하지 않고 생각·말·행동을 일치시키려는 강점입니다.", "short": "사실을 숨기지 않고 말과 행동을 맞추는 힘"}, {"code": "C04", "name": "활력", "virtue": "용기", "subtitle": "", "sections": {"core": "일상과 활동에 생동감·에너지·열의를 가지고 참여하는 강점이다. 해야 할 일을 수동적으로 견디기보다 의미를 찾고 적극적으로 움직이는 모습으로 나타난다.", "work": "맡은 일에 에너지를 투입하고 주변의 참여 분위기를 북돋는 모습으로 나타난다. 새로운 과제나 변화에도 생기 있게 접근해 시작의 동력을 만들 수 있다.", "relationship": "함께하는 시간에 관심과 생기를 더해 관계의 분위기를 밝게 만들 수 있다. 상대의 기쁨이나 새로운 시도에 적극적으로 반응하는 모습으로 나타난다.", "underuse": "이 강점이 덜 드러날 때는 필요한 만큼만 참여하거나 에너지를 아끼면서, 활동의 의미와 즐거움을 충분히 느끼지 못할 수 있다.", "overuse": "지나치게 쓰이면 자신의 속도를 주변에도 기대하거나, 충분히 쉬어야 할 신호를 놓치고 계속 에너지를 사용할 수 있다.", "balance": "에너지를 쏟을 우선순위를 정하고 회복 시간을 함께 확보한다. 주변의 속도와 상태를 살피며 활력을 강요하기보다 선택할 수 있는 참여의 동력으로 나눈다."}, "def": "일상과 활동에서 생기와 열의를 느끼고 에너지를 기울여 참여하는 강점입니다.", "short": "생기와 열의를 느끼며 활동에 참여하는 힘"}, {"code": "H01", "name": "사랑", "virtue": "인간애", "subtitle": "", "sections": {"core": "가까운 사람과 관심·애정·돌봄을 주고받는 관계를 중요하게 여기고 유지하는 강점이다. 일방적으로 베푸는 것뿐 아니라 필요할 때 상대의 도움과 마음을 받아들이는 모습도 포함한다.", "work": "함께 일하는 사람을 역할만으로 대하지 않고 지속적인 관심과 신뢰를 쌓는 모습으로 나타난다. 어려운 시기에 정서적인 지지를 주고받으며 관계의 안정성을 높일 수 있다.", "relationship": "소중한 사람에게 마음과 관심을 표현하고, 관계를 유지하기 위해 시간과 노력을 기울이는 모습으로 나타난다. 가까운 사람의 돌봄을 받아들이며 상호적인 연결을 만든다.", "underuse": "이 강점이 덜 드러날 때는 가까운 관계에서도 속마음과 필요한 도움을 드러내지 않아 정서적인 거리가 커질 수 있다.", "overuse": "지나치게 쓰이면 관계를 지키기 위해 자신의 필요를 뒤로 미루거나, 가까운 사람의 선택과 감정에 지나치게 관여할 수 있다.", "balance": "관심과 애정을 표현하면서도 서로의 경계와 자율성을 존중한다. 돌봄을 주는 것과 받는 것의 균형을 살피고, 관계 밖에서 자신을 돌보는 시간도 확보한다."}, "def": "가까운 사람과 관심과 애정을 주고받으며 깊고 상호적인 관계를 가꾸는 강점입니다.", "short": "가까운 사람과 깊은 애정을 주고받는 힘"}, {"code": "H02", "name": "친절", "virtue": "인간애", "subtitle": "", "sections": {"core": "대가나 의무만을 따지지 않고 다른 사람에게 도움과 배려를 행동으로 제공하는 강점이다. 상대의 필요를 알아차리고 자신이 할 수 있는 범위에서 실제 행동으로 옮기는 모습으로 나타난다.", "work": "어려움을 겪는 사람에게 정보·시간·도움을 나누고, 작은 불편을 줄이려는 모습으로 나타난다. 협력적인 분위기와 상호 지원을 만드는 데 기여할 수 있다.", "relationship": "상대의 상황을 세심하게 살피고 필요한 배려를 행동으로 보여주는 데 도움이 된다. 친밀하지 않은 사람에게도 기본적인 관심과 호의를 표현할 수 있다.", "underuse": "이 강점이 덜 드러날 때는 자신의 일과 필요에 집중하면서 주변이 필요로 하는 도움을 알아차리거나 행동으로 옮길 기회가 줄어들 수 있다.", "overuse": "지나치게 쓰이면 요청받지 않은 도움으로 상대의 자율성을 침해하거나, 자신의 시간과 에너지를 과도하게 사용할 수 있다.", "balance": "돕기 전에 상대가 원하는 도움이 무엇인지 확인한다. 자신이 감당할 수 있는 범위를 정하고, 친절을 베푸는 것과 필요한 경우 거절하는 것을 함께 연습한다."}, "def": "대가나 의무만을 따지지 않고 다른 사람에게 필요한 도움과 배려를 행동으로 옮기는 강점입니다.", "short": "필요한 도움과 배려를 행동으로 옮기는 힘"}, {"code": "H03", "name": "관계감각", "virtue": "인간애", "subtitle": "", "sections": {"core": "자신과 타인의 감정·동기를 알아차리고 사람들 사이의 상황을 파악해 적절하게 반응하는 강점이다. 사교적인 정도와는 다르며, 관계의 미묘한 변화와 맥락을 읽는 모습으로 나타난다.", "work": "표정·말투·참여 정도의 변화를 살피고 상황에 맞게 소통 방식을 조정하는 모습으로 나타난다. 겉으로 드러난 말뿐 아니라 그 배경의 필요를 파악해 협업과 갈등 조정에 도움을 줄 수 있다.", "relationship": "상대가 직접 말하지 않은 감정과 의도를 헤아리고, 관계의 분위기에 맞게 반응하는 데 도움이 된다. 자신의 감정이 관계에 미치는 영향도 돌아볼 수 있다.", "underuse": "이 강점이 덜 드러날 때는 상대가 명확하게 표현한 정보에 주로 의지해, 말하지 않은 불편이나 관계의 변화를 뒤늦게 알아차릴 수 있다.", "overuse": "지나치게 쓰이면 상대의 반응을 계속 해석하느라 자신의 생각을 충분히 표현하지 못하거나, 확인되지 않은 의도를 앞서 추측할 수 있다.", "balance": "알아차린 분위기와 감정을 사실로 단정하지 말고 질문을 통해 확인한다. 관계를 살피는 것과 자신의 입장과 필요를 분명히 표현하는 것을 함께 유지한다."}, "def": "사교성 자체가 아니라 자신과 타인의 감정과 동기를 알아차리고 관계의 맥락에 맞게 반응하는 강점입니다.", "short": "감정과 관계의 맥락을 읽고 반응하는 힘"}, {"code": "J01", "name": "팀워크", "virtue": "정의", "subtitle": "", "sections": {"core": "공동의 목표와 전체의 성과를 위해 자신의 역할을 수행하고 다른 구성원과 협력하는 강점이다. 개인의 성과만이 아니라 서로의 역할이 어떻게 연결되는지 살피는 모습으로 나타난다.", "work": "필요한 정보와 자원을 공유하고, 전체 진행에 맞춰 자신의 방식과 일정을 조정하는 모습으로 나타난다. 공동의 결과를 위해 맡은 역할 밖의 연결 지점도 살필 수 있다.", "relationship": "함께 정한 약속과 목표를 존중하고, 자신의 몫을 다하며 신뢰를 쌓는 데 도움이 된다. 서로 다른 장점을 연결해 혼자보다 나은 결과를 만들 수 있다.", "underuse": "이 강점이 덜 드러날 때는 자신의 업무와 성과에 집중하면서 전체 흐름이나 다른 사람과의 연결을 충분히 살피지 못할 수 있다.", "overuse": "지나치게 쓰이면 집단의 조화를 위해 다른 의견을 말하지 못하거나, 개인의 경계와 우선순위를 지나치게 양보할 수 있다.", "balance": "공동 목표와 자신의 역할을 분명히 하되 필요한 이견은 솔직하게 제시한다. 협력할 부분과 각자 책임질 부분을 구분하고, 기여와 부담이 한쪽에 몰리지 않는지 살핀다."}, "def": "공동의 목표와 전체의 성과를 위해 자신의 역할을 수행하고 다른 구성원과 협력하는 강점입니다.", "short": "공동의 목표를 위해 역할을 연결하는 힘"}, {"code": "J02", "name": "공정성", "virtue": "정의", "subtitle": "", "sections": {"core": "개인적인 호불호나 이해관계에 치우치지 않고 일관되고 균형 있는 기준으로 사람을 대하려는 강점이다. 서로 다른 입장을 듣고 기회와 책임이 한쪽에만 유리하지 않은지 살피는 모습으로 나타난다.", "work": "역할·기회·업무를 나눌 때 적용 기준을 확인하고, 비슷한 상황에는 비슷한 원칙을 적용하려는 모습으로 나타난다. 의견이 충돌할 때 어느 한쪽을 판단하기 전에 각자의 이야기를 들을 수 있다.", "relationship": "가까운 정도에 따라 기준을 크게 바꾸기보다 상대를 동등하게 존중하는 데 도움이 된다. 갈등에서도 자신에게 유리한 결과보다 모두가 납득할 수 있는 기준을 찾으려 한다.", "underuse": "이 강점이 덜 드러날 때는 친분·선입견·현재 감정이 판단에 더 크게 작용해 사람마다 다른 기준이 적용될 수 있다.", "overuse": "지나치게 쓰이면 서로 다른 상황과 필요를 충분히 고려하지 않고 모두에게 똑같은 방식만 적용하거나, 관계의 정서적인 부분을 놓칠 수 있다.", "balance": "동일한 기준과 개별 상황에 대한 고려를 함께 살핀다. 기준을 투명하게 설명하고, 결정에 영향을 받는 사람의 의견을 들으며 필요한 경우 합리적으로 조정한다."}, "def": "개인적인 친분이나 호감에 치우치지 않고 일관된 기준과 균형을 바탕으로 사람을 대하는 강점입니다.", "short": "치우침 없이 일관된 기준으로 대하는 힘"}, {"code": "J03", "name": "리더십", "virtue": "정의", "subtitle": "", "sections": {"core": "여러 사람이 함께할 때 공동의 방향을 분명히 하고 참여와 협력을 이끄는 강점이다. 공식적인 지위와 관계없이, 상황이 정체되거나 의견이 흩어질 때 앞으로 나아갈 기준을 제시하는 모습으로 나타난다.", "work": "목표와 진행 방향을 정리하고 구성원이 참여할 수 있는 기회를 만드는 모습으로 나타난다. 일이 막혔을 때 선택 기준을 제시하고 역할과 자원을 연결해 다시 움직이게 할 수 있다.", "relationship": "함께해야 할 일이 있을 때 각자의 의견을 듣고 공통의 방향을 만드는 데 도움이 된다. 다른 사람이 자신의 역할을 발휘하도록 격려하고 참여를 촉진할 수 있다.", "underuse": "이 강점이 덜 드러날 때는 방향을 정할 사람이 필요한 상황에서도 다른 사람이 나서기를 기다리며, 공동의 진행이 늦어질 수 있다.", "overuse": "지나치게 쓰이면 자신의 방향을 빠르게 제시하느라 다른 사람의 의견과 주도성을 줄이거나, 필요 이상으로 책임과 결정을 맡을 수 있다.", "balance": "방향을 제시하기 전에 구성원의 의견과 상황을 충분히 듣는다. 결정할 때와 기다릴 때를 구분하고, 역할과 권한을 나누어 다른 사람도 주도할 수 있게 한다."}, "def": "공동의 목표와 방향을 분명히 하고 구성원의 참여를 이끌어 함께 움직이게 하는 강점입니다.", "short": "방향을 제시하고 함께 움직이게 하는 힘"}, {"code": "T01", "name": "용서", "virtue": "절제", "subtitle": "", "sections": {"core": "받은 상처와 잘못을 부정하지 않으면서도 적대감과 보복 욕구에 계속 매이지 않으려는 강점이다. 잘못을 정당화하거나 관계를 반드시 회복하는 것이 아니라, 상처가 자신의 현재를 계속 지배하지 않도록 놓아가는 모습이다.", "work": "실수와 갈등이 있었을 때 책임은 분명히 하되 그 일을 상대의 전체 모습으로 확대하지 않는 데 도움이 된다. 변화와 책임 있는 행동이 확인되면 다시 협력할 가능성을 열어둘 수 있다.", "relationship": "상처받은 경험을 인정하면서도 같은 일을 계속 들추거나 보복하려는 마음에서 조금씩 벗어날 수 있다. 사과와 변화가 진심이라고 느껴질 때 관계의 다음 선택을 차분히 생각하는 모습으로 나타난다.", "underuse": "이 강점이 덜 드러날 때는 과거의 상처와 분노가 오래 남아 현재의 판단이나 관계에 계속 영향을 줄 수 있다.", "overuse": "지나치게 쓰이면 충분한 사과와 변화가 없는데도 문제를 빨리 덮거나, 필요한 경계와 책임 확인을 생략할 수 있다.", "balance": "용서와 책임, 용서와 관계 회복을 서로 구분한다. 감정을 충분히 인정하고 필요한 경계를 세운 뒤, 자신에게 도움이 되는 속도로 적대감에서 벗어날 방법을 선택한다."}, "def": "상처와 잘못을 부정하거나 관계 회복을 의무화하지 않으면서 적대감과 보복하려는 마음을 줄이는 강점입니다.", "short": "적대감과 보복하려는 마음을 줄이는 힘"}, {"code": "T02", "name": "겸손", "virtue": "절제", "subtitle": "", "sections": {"core": "자신의 장점과 성취를 과장하지 않고 한계와 다른 사람의 기여를 함께 인정하는 강점이다. 자신을 낮추는 것이 아니라, 자신과 타인의 몫을 실제에 가깝게 바라보는 모습으로 나타난다.", "work": "좋은 결과에서 함께한 사람의 기여를 인정하고, 모르는 부분에서는 도움과 조언을 받아들이는 모습으로 나타난다. 자신의 성과를 지나치게 앞세우지 않아 협력과 학습의 여지를 만들 수 있다.", "relationship": "자신이 옳다는 것을 증명하기보다 상대에게 배울 점과 자신의 영향을 돌아보는 데 도움이 된다. 실수나 한계를 인정해 관계의 방어적인 분위기를 낮출 수 있다.", "underuse": "이 강점이 덜 드러날 때는 자신의 역할과 성과를 크게 강조하거나, 다른 사람의 기여와 조언을 받아들이기 어려울 수 있다.", "overuse": "지나치게 쓰이면 실제 기여와 능력까지 축소해 표현하거나, 필요한 자리에서 자신의 성과와 의견을 드러내지 못할 수 있다.", "balance": "자신의 기여와 타인의 기여를 모두 구체적으로 인정한다. 겸손을 자기 축소와 구분하고, 필요한 상황에서는 사실에 근거해 성과와 전문성을 분명하게 표현한다."}, "def": "자신의 능력과 성과를 부풀리지 않고, 틀릴 가능성과 배울 점을 인정하는 강점입니다.", "short": "성과와 한계를 실제에 가깝게 보는 힘"}, {"code": "T03", "name": "신중함", "virtue": "절제", "subtitle": "", "sections": {"core": "행동이나 결정을 내리기 전에 예상되는 결과와 위험을 살피는 강점이다. 충동적으로 선택하기보다 감당할 수 있는지 확인하고 불필요한 후회를 줄이려는 모습으로 나타난다.", "work": "중요한 결정 전에 위험·부담·후속 영향을 검토하고, 지킬 수 있는 약속과 책임을 선택하는 모습으로 나타난다. 잠재적인 문제를 미리 발견해 안정적인 실행을 돕는다.", "relationship": "감정이 앞서는 순간에도 말과 행동이 상대에게 어떤 영향을 줄지 한 번 더 생각하는 데 도움이 된다. 쉽게 약속하기보다 실제로 지킬 수 있는 범위를 확인할 수 있다.", "underuse": "이 강점이 덜 드러날 때는 선택의 영향과 위험이 충분히 보이지 않은 상태에서 먼저 결정해 예상하지 못한 부담이 생길 수 있다.", "overuse": "지나치게 쓰이면 위험을 줄이려는 검토가 길어져 결정과 시도가 늦어지거나, 가능성보다 문제를 먼저 보게 될 수 있다.", "balance": "결정의 중요도에 따라 검토할 범위와 시간을 정한다. 회복 가능한 작은 선택은 빠르게 시도하고, 영향이 큰 결정에는 충분한 점검과 대비책을 마련한다."}, "def": "행동하거나 결정하기 전에 예상되는 결과·위험·책임을 살펴 불필요한 후회를 줄이는 강점입니다.", "short": "결과와 위험을 미리 살펴 결정하는 힘"}, {"code": "T04", "name": "자기조절", "virtue": "절제", "subtitle": "", "sections": {"core": "감정·충동·주의·습관을 자신의 목표와 상황에 맞게 조정하는 강점이다. 순간의 기분에 끌려가기보다 선택한 방향을 유지하도록 자신을 관리하는 모습으로 나타난다.", "work": "집중을 방해하는 요소를 관리하고, 감정이 크게 흔들릴 때도 바로 반응하기보다 행동을 조절하는 모습으로 나타난다. 목표에 필요한 습관과 일정을 유지해 안정적인 수행을 돕는다.", "relationship": "감정이 격해진 순간에 즉시 말하거나 행동하지 않고 반응을 조절하는 데 도움이 된다. 자신의 감정을 억누르기보다 적절한 방식과 시점을 선택할 수 있다.", "underuse": "이 강점이 덜 드러날 때는 기분과 충동에 따라 계획이나 반응이 자주 달라져 원하는 방향을 유지하기 어려울 수 있다.", "overuse": "지나치게 쓰이면 감정과 욕구를 지나치게 통제해 긴장이 쌓이거나, 계획에서 벗어나는 상황에 유연하게 대응하기 어려울 수 있다.", "balance": "조절해야 할 것과 자연스럽게 허용해도 될 것을 구분한다. 감정을 없애려 하기보다 알아차리고 표현 방식을 선택하며, 계획 안에 휴식과 예외의 여지를 둔다."}, "def": "감정·충동·주의·습관을 자신의 목표와 상황에 맞게 조정하는 강점입니다.", "short": "감정·충동·습관을 목표에 맞게 조절하는 힘"}, {"code": "X01", "name": "심미안", "virtue": "초월", "subtitle": "", "sections": {"core": "자연·예술·능력·성과에서 아름다움과 탁월함을 발견하고 깊이 느끼는 강점이다. 단순한 취향을 넘어 잘 만들어진 것과 뛰어난 수행의 가치를 알아보는 모습으로 나타난다.", "work": "완성도 높은 결과물과 뛰어난 전문성을 알아보고 그 가치를 구체적으로 인정하는 모습으로 나타난다. 품질·구성·표현의 세부 차이를 살펴 결과의 수준을 높이는 데 도움이 된다.", "relationship": "상대의 재능과 노력에서 빛나는 부분을 발견하고 진심으로 감탄하거나 인정할 수 있다. 함께 아름다운 경험을 나누며 관계의 정서적인 풍요를 더할 수 있다.", "underuse": "이 강점이 덜 드러날 때는 결과의 기능과 효율에 집중하면서 아름다움·완성도·탁월함이 주는 가치와 감동을 지나칠 수 있다.", "overuse": "지나치게 쓰이면 내용보다 형식과 완성도에 많은 에너지를 쓰거나, 높은 기준 때문에 평범하지만 충분한 결과를 인정하기 어려울 수 있다.", "balance": "아름다움과 완성도가 목적과 사용성에 어떻게 기여하는지 함께 살핀다. 탁월함을 감상하되 비교와 완벽주의로 이어지지 않도록 과정과 현실적인 기준도 인정한다."}, "def": "자연·예술·능력·성과에서 아름다움과 탁월함을 발견하고 그 가치를 깊이 느끼는 강점입니다.", "short": "아름다움과 탁월함을 발견하고 느끼는 힘"}, {"code": "X02", "name": "감사", "virtue": "초월", "subtitle": "", "sections": {"core": "받은 도움과 삶의 긍정적인 부분을 당연하게 여기지 않고 고마움을 느끼고 표현하는 강점이다. 자신이 이룬 결과 안에서도 다른 사람과 환경의 기여를 알아보는 모습으로 나타난다.", "work": "도움·협력·배려를 구체적으로 알아보고 감사의 마음을 표현하는 모습으로 나타난다. 작은 진전과 지원을 인식해 서로의 기여가 보이는 분위기를 만드는 데 도움이 된다.", "relationship": "익숙한 관계에서도 상대가 해주는 일을 당연하게 여기지 않고 고마움을 표현할 수 있다. 어려운 시기에도 관계 안에 남아 있는 긍정적인 부분을 발견하는 데 도움이 된다.", "underuse": "이 강점이 덜 드러날 때는 도움과 좋은 결과를 익숙하거나 당연한 것으로 받아들여, 고마움과 기여가 충분히 표현되지 않을 수 있다.", "overuse": "지나치게 쓰이면 불편함이나 부당함이 있어도 좋은 점만 보려 하거나, 도움을 받았다는 이유로 필요 이상으로 빚진 마음을 가질 수 있다.", "balance": "고마운 점을 구체적으로 표현하면서도 필요한 문제와 요구는 별도로 다룬다. 감사와 의무감을 구분하고, 받은 도움을 자신의 방식으로 선순환시키되 무리하게 갚으려 하지 않는다."}, "def": "받은 도움과 삶의 긍정적인 부분을 당연하게 여기지 않고 알아차려 표현하는 강점입니다.", "short": "고마움을 알아차리고 표현하는 힘"}, {"code": "X03", "name": "희망", "virtue": "초월", "subtitle": "", "sections": {"core": "원하는 미래가 가능하다고 믿고 그 미래에 도달할 길을 찾으려는 강점이다. 상황이 어려울 때도 자신이 할 수 있는 일이 남아 있다고 보고 다음 행동을 모색하는 모습으로 나타난다.", "work": "예상대로 되지 않는 상황에서도 가능한 목표와 대안을 찾으며 다시 움직이는 모습으로 나타난다. 변화의 가능성을 언어로 제시해 자신과 주변이 시도할 힘을 유지하도록 돕는다.", "relationship": "관계가 어려울 때도 변화 가능성을 완전히 닫지 않고, 현재 할 수 있는 행동을 찾아보는 데 도움이 된다. 상대의 가능성과 앞으로의 성장을 기대하는 태도로 나타날 수 있다.", "underuse": "이 강점이 덜 드러날 때는 현재의 어려움이 앞으로도 계속될 것처럼 느껴져 새로운 시도와 대안을 찾기 어려울 수 있다.", "overuse": "지나치게 쓰이면 현실적인 위험과 제약을 충분히 살피지 않거나, 근거 없는 긍정으로 다른 사람의 어려움을 가볍게 받아들일 수 있다.", "balance": "긍정적인 미래를 그리되 현재의 사실과 장애를 함께 인정한다. 기대를 구체적인 목표와 다음 행동으로 연결하고, 계획이 막히면 목표를 포기하기보다 다른 경로를 탐색한다."}, "def": "미래의 긍정적인 가능성을 기대하고 목표에 이르는 여러 길을 찾아 행동하는 강점입니다.", "short": "긍정적인 가능성을 믿고 길을 찾는 힘"}, {"code": "X04", "name": "유머", "virtue": "초월", "subtitle": "", "sections": {"core": "일상에서 웃을 만한 부분을 발견하고 즐거움과 웃음을 나누는 강점이다. 어려운 상황을 부정하지 않으면서도 잠시 가볍게 바라볼 여유를 만드는 모습으로 나타난다.", "work": "긴장된 분위기를 적절한 웃음으로 완화하고 사람들의 참여를 편안하게 만드는 모습으로 나타난다. 예상치 못한 문제에서도 숨을 돌릴 여유와 새로운 에너지를 더할 수 있다.", "relationship": "함께 웃고 장난스러운 순간을 나누며 친밀감과 편안함을 높이는 데 도움이 된다. 갈등이나 어려움 속에서도 관계가 지나치게 무거워지지 않도록 관점을 전환할 수 있다.", "underuse": "이 강점이 덜 드러날 때는 긴장되거나 어려운 상황을 계속 심각하게 받아들여 웃음과 가벼움이 들어갈 여지가 줄어들 수 있다.", "overuse": "지나치게 쓰이면 진지하게 다뤄야 할 문제를 가볍게 넘기거나, 상대가 불편한 농담으로 감정을 피할 수 있다.", "balance": "웃음을 사용하기 전에 상황과 상대의 상태를 살핀다. 문제와 감정을 충분히 인정한 뒤 긴장을 낮추는 방향으로 유머를 사용하고, 누군가를 희생시키는 웃음은 피한다."}, "def": "일상과 어려움 속에서도 웃을 여지를 발견하고 상대를 존중하며 즐거움을 나누는 강점입니다.", "short": "웃을 여지를 발견하고 즐거움을 나누는 힘"}, {"code": "X05", "name": "영성", "virtue": "초월", "subtitle": "삶의 의미와 더 큰 가치를 방향으로 삼는 힘", "sections": {"core": "자신의 삶과 일이 더 큰 가치·목적·연결 속에 있다고 느끼고 이를 선택의 기준으로 삼는 강점이다. 종교의 유무와 관계없이 무엇을 위해 살아가고 기여할지를 돌아보는 모습으로 나타난다.", "work": "맡은 일을 개인의 성과만이 아니라 고객·동료·조직·사회에 주는 의미와 연결하는 모습으로 나타난다. 어려운 결정에서도 중요하게 여기는 가치와 목적을 기준으로 방향을 정하는 데 도움이 된다.", "relationship": "관계를 당장의 감정이나 이해관계만으로 보지 않고, 서로의 삶과 성장에 어떤 의미가 있는지 돌아보는 데 도움이 된다. 자신보다 더 큰 공동체와 연결되어 있다는 감각이 배려와 책임으로 이어질 수 있다.", "underuse": "이 강점이 덜 드러날 때는 당장의 목표와 성과에 집중하면서, 일이 왜 중요한지 또는 삶의 더 큰 방향과 어떻게 연결되는지 느끼기 어려울 수 있다.", "overuse": "지나치게 쓰이면 자신의 가치와 의미를 다른 사람에게도 같은 방식으로 적용하거나, 현실적인 조건과 구체적인 문제를 충분히 살피지 않을 수 있다.", "balance": "의미와 목적을 자신과 타인의 선택을 통제하는 잣대가 아니라 삶의 방향을 점검하는 기준으로 삼는다. 가치에 맞는 작은 행동을 구체화하고, 서로 다른 신념과 삶의 목적을 존중한다."}, "def": "종교의 유무와 관계없이 삶의 의미와 목적, 자신보다 큰 가치와의 연결을 느끼고 선택의 방향으로 삼는 강점입니다.", "short": "삶의 의미와 더 큰 가치를 방향으로 삼는 힘"}];

rue},{"id":"T04-1","code":"T04","text":"감정이 크게 흔들릴 때 바로 반응하지 않고 진정할 시간을 만든다.","rev":false},{"id":"T04-2","code":"T04","text":"집중해야 할 때 알림·휴대전화·주변 자극을 미리 줄인다.","rev":false},{"id":"T04-3","code":"T04","text":"목표에 방해되는 생활 습관을 줄이는 편이다.","rev":false},{"id":"T04-4","code":"T04","text":"그날의 기분이나 충동에 따라 미리 정한 계획을 바꾸는 편이다.","rev":true},{"id":"X01-1","code":"X01","text":"자연이나 예술의 아름다움을 만나면 잠시 멈추어 바라본다.","rev":false},{"id":"X01-2","code":"X01","text":"누군가의 뛰어난 기술을 보면 무엇이 탁월한지 자세히 살펴본다.","rev":false},{"id":"X01-3","code":"X01","text":"정교한 결과물이나 훌륭한 성취를 접하면 감탄하거나 깊이 감동한다.","rev":false},{"id":"X01-4","code":"X01","text":"일상에서 아름답거나 뛰어난 것을 보아도 눈여겨보지 않는 편이다.","rev":true},{"id":"X02-1","code":"X02","text":"좋은 결과를 돌아볼 때 도움을 준 사람에게 고마움을 느낀다.","rev":false},{"id":"X02-2","code":"X02","text":"도움을 받은 뒤 구체적으로 무엇이 고마웠는지 상대에게 표현한다.","rev":false},{"id":"X02-3","code":"X02","text":"평범한 하루에서도 고마움을 느끼는 순간을 알아차린다.","rev":false},{"id":"X02-4","code":"X02","text":"다른 사람의 도움을 받아도 당연하게 여기는 편이다.","rev":true},{"id":"X03-1","code":"X03","text":"어려운 상황에서도 앞으로 나아질 가능성이 있다고 느낀다.","rev":false},{"id":"X03-2","code":"X03","text":"상황이 어려워도 내가 영향을 줄 수 있는 부분이 있다고 생각한다.","rev":false},{"id":"X03-3","code":"X03","text":"한 방법이 막히면 같은 목표에 이르는 다른 길을 찾는다.","rev":false},{"id":"X03-4","code":"X03","text":"상황이 나빠지면 내가 노력해도 달라질 가능성이 적다고 느낀다.","rev":true},{"id":"X04-1","code":"X04","text":"평범한 대화에서도 재미있는 관점이나 표현을 떠올려 함께 웃는다.","rev":false},{"id":"X04-2","code":"X04","text":"긴장된 상황에서 잠시 숨을 돌릴 수 있는 웃음을 만든다.","rev":false},{"id":"X04-3","code":"X04","text":"상대의 반응을 살피며 농담의 강도나 표현을 조절한다.","rev":false},{"id":"X04-4","code":"X04","text":"일상에서 웃을 만한 부분을 잘 발견하지 못하는 편이다.","rev":true},{"id":"X05-1","code":"X05","text":"선택을 앞두면 내가 중요하게 여기는 삶의 방향과 맞는지 돌아본다.","rev":false},{"id":"X05-2","code":"X05","text":"힘든 일을 겪을 때 그 경험이 내 삶에서 어떤 의미가 될지 돌아본다.","rev":false},{"id":"X05-3","code":"X05","text":"삶이 공동체·자연·신념과 이어져 있다는 느낌을 중요하게 여긴다.","rev":false},{"id":"X05-4","code":"X05","text":"목표를 세울 때 그 의미보다 달성 여부를 우선하는 편이다.","rev":true}];

<script>
/* ====================== 채점 로직 (한 곳에 고정) ====================== */

/* 역문항 응답 뒤집기: 1↔5, 2↔4, 3=3 */
function reverseScore(v) { return 6 - v; }

/* 응답(answers: {문항ID: 1~5}) → 강점별 평균 점수 {code: 평균} */
function computeScores(answers) {
  const byCode = {};
  QITEMS.forEach(function (q) {
    let v = answers[q.id];
    if (v == null) return;
    if (q.rev) v = reverseScore(v);
    if (!byCode[q.code]) byCode[q.code] = [];
    byCode[q.code].push(v);
  });
  const scores = {};
  Object.keys(byCode).forEach(function (code) {
    const arr = byCode[code];
    const sum = arr.reduce(function (a, b) { return a + b; }, 0);
    scores[code] = sum / arr.length; // 1~5
  });
  return scores;
}

/* 강점 점수 → 내림차순 정렬된 [{code, score}] */
function rankStrengths(scores) {
  return STRENGTHS
    .map(function (s) { return { code: s.code, score: scores[s.code] != null ? scores[s.code] : 0 }; })
    .sort(function (a, b) {
      if (b.score !== a.score) return b.score - a.score;
      return a.code < b.code ? -1 : 1; // 동점이면 코드순(안정적)
    });
}

/* 상위 5강점 코드 배열 */
function top5Codes(scores) {
  var r = rankStrengths(scores);
  if (r.length <= 5) return r.map(function (x) { return x.code; });
  // 5위 점수와 같은 강점은 모두 포함 (동점 강제 절단 방지)
  var cutScore = r[4].score;
  var out = [];
  for (var i = 0; i < r.length; i++) {
    if (i < 5 || r[i].score === cutScore) out.push(r[i].code);
    else break;
  }
  return out;
}

/* 결과를 억지로 5개로 자르지 않기 위한 프로필 상태 분석.
   96문항형은 0.25, 72문항형은 약 0.33 단위로 점수가 움직이므로
   전체 폭 0.5 미만은 강점 간 차이가 거의 없는 경우로 봅니다. */
const FLAT_PROFILE_GAP = 0.5;
function analyzeProfile(scores) {
  var ranked = rankStrengths(scores || {});
  if (!ranked.length) return { status: "flat", range: 0, topCodes: [], clearCodes: [], tiedCodes: [] };
  var range = ranked[0].score - ranked[ranked.length - 1].score;
  var rawTop = top5Codes(scores || {});
  var cutScore = ranked.length >= 5 ? ranked[4].score : ranked[ranked.length - 1].score;
  var clearCodes = ranked.filter(function (x) { return x.score > cutScore; }).map(function (x) { return x.code; });
  var tiedCodes = ranked.filter(function (x) { return x.score === cutScore; }).map(function (x) { return x.code; });
  if (range < FLAT_PROFILE_GAP) {
    return { status: "flat", range: range, topCodes: [], clearCodes: [], tiedCodes: ranked.map(function (x) { return x.code; }) };
  }
  if (rawTop.length > 6) {
    return { status: "ambiguous_cutoff", range: range, topCodes: clearCodes.slice(), clearCodes: clearCodes, tiedCodes: tiedCodes };
  }
  return { status: "normal", range: range, topCodes: rawTop, clearCodes: rawTop, tiedCodes: [] };
}

function resultStatusType(value) {
  return value === "flat" || value === "ambiguous_cutoff" ? value : "normal";
}
function resultStatusLabel(value) {
  var status = resultStatusType(value);
  return status === "flat" ? "강점 간 차이 거의 없음" : status === "ambiguous_cutoff" ? "상위 경계 동점 다수" : "일반 결과";
}
function competitionRankMap(scores) {
  var ranked = rankStrengths(scores || {}), map = {}, rank = 0, prev = null;
  ranked.forEach(function (item, idx) {
    if (idx === 0 || item.score !== prev) rank = idx + 1;
    map[item.code] = rank; prev = item.score;
  });
  return map;
}
function rankLabel(code, scores) {
  var map = competitionRankMap(scores || {});
  return map[code] ? String(map[code]) : "";
}

/* 5위와 6위가 근소차인지 (화면 안내용, 수치는 노출 안 함) */
const CLOSE_GAP = 0.25;
function hasHiddenTieFor(scores, top5) {
  if (!top5 || !top5.length) return false;
  var ranked = rankStrengths(scores);
  var lastScore = scores[top5[top5.length - 1]];
  var count = 0;
  for (var i = 0; i < ranked.length; i++) if (ranked[i].score === lastScore) count++;
  var inTop = top5.filter(function (c) { return scores[c] === lastScore; }).length;
  return count > inTop;
}
function isCloseAtCut(scores) {
  const r = rankStrengths(scores);
  if (r.length < 6) return false;
  return (r[4].score - r[5].score) <= CLOSE_GAP;
}

/* 경험확인 응답 → 라벨. checks[code] = [0~2, 0~2, 0~2, 0~2]
   합계로 3구간. 순위는 절대 바꾸지 않음. */
function checkLabel(arr) {
  if (!arr || arr.length < 4) return null;
  const sum = arr.reduce(function (a, b) { return a + b; }, 0); // 0~8
  if (sum >= 6) return { key: "core", text: "실제 경험과 연결이 높은 강점", color: "#3E7C5A" };
  if (sum >= 3) return { key: "grow", text: "경험과 어느 정도 연결된 강점", color: "#B0812E" };
  return { key: "explore", text: "경험 속에서 더 확인해 볼 강점", color: "#6E7B86" };
}

function strengthByCode(code) {
  for (let i = 0; i < STRENGTHS.length; i++)
    if (STRENGTHS[i].code === code) return STRENGTHS[i];
  return null;
}

/* API 헬퍼 */
async function api(action, payload) {
  if (!API_URL) throw new Error("API_URL이 설정되지 않았습니다.");
  const res = await fetch(API_URL, {
    method: "POST",
    body: JSON.stringify(Object.assign({ action: action }, payload || {}))
  });
  return res.json();
}
function sanitize(code) { return String(code || "").trim(); }
function makeId() {
  if (window.crypto && window.crypto.randomUUID) return window.crypto.randomUUID();
  return "r-" + Date.now() + "-" + Math.random().toString(36).slice(2, 10);
}
function sleep(ms) { return new Promise(function (res) { setTimeout(res, ms); }); }
// 완료 시각은 한 번만 기록하고, 표시할 때 한국 시간(UTC+9)으로 변환합니다.
function formatKoreaTime(value) {
  if (value == null || value === "") return "시각 정보 없음";
  const n = new Date(value).getTime();
  if (!isFinite(n) || n <= 0) return "시각 정보 없음";
  const d = new Date(n + 9 * 60 * 60 * 1000);
  function p(v) { return v < 10 ? "0" + v : String(v); }
  return d.getUTCFullYear() + "." + p(d.getUTCMonth() + 1) + "." + p(d.getUTCDate())
    + " " + p(d.getUTCHours()) + ":" + p(d.getUTCMinutes()) + ":" + p(d.getUTCSeconds()) + " (한국 시간)";
}
function participationLabel(kind) {
  return kind === "retake" ? "재진단" : kind === "first" ? "첫 참여" : "이전 기록·미구분";
}
function groupBaseRows(rows) {
  // 이름은 본인 확인 수단이 아닙니다. 같은 이름끼리 합치거나 최신 결과로 덮지 않습니다.
  // 재진단과 대표 강점을 구분하기 어려운 결과는 개인 기록에는 남기되 그룹 통계에서는 제외합니다.
  return (rows || []).filter(function (r) {
    return r.participation !== "retake" && resultStatusType(r.resultStatus) === "normal";
  });
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function shuffleSpread(arr) {
  // 강점별 문항을 먼저 섞고, 한 순환에 각 강점 문항을 하나씩 배치합니다.
  // 72·96문항형 모두 같은 강점이 연속해서 나오는 일을 구조적으로 막습니다.
  const buckets = {};
  arr.forEach(function (q) {
    if (!buckets[q.code]) buckets[q.code] = [];
    buckets[q.code].push(q);
  });
  const codes = Object.keys(buckets);
  codes.forEach(function (c) { buckets[c] = shuffle(buckets[c]); });
  const rounds = codes.reduce(function (m, c) { return Math.max(m, buckets[c].length); }, 0);
  const out = [];
  let previousCode = null;
  for (let round = 0; round < rounds; round++) {
    const available = shuffle(codes.filter(function (c) { return buckets[c][round]; }));
    if (available.length > 1 && available[0] === previousCode) {
      const t = available[0]; available[0] = available[1]; available[1] = t;
    }
    available.forEach(function (c) { out.push(buckets[c][round]); });
    if (available.length) previousCode = available[available.length - 1];
  }
  return out;
}

/* ---------- 공통 UI ---------- */
function Btn(props) {
  const base = {
    display: "block", width: "100%", padding: "15px 18px", borderRadius: 12,
    fontSize: 16, fontWeight: 600, transition: "opacity .15s",
    background: props.disabled ? "#C7CBC6" : (props.color || "#3E6B52"),
    color: "#fff", opacity: props.disabled ? 0.7 : 1
  };
  return h("button", {
    style: Object.assign(base, props.style || {}),
    disabled: props.disabled, onClick: props.onClick
  }, props.children);
}

function Progress(props) {
  const pct = Math.round((props.value / props.max) * 100);
  return h("div", { style: { margin: "0 0 22px" } },
    h("div", { style: { height: 6, background: "#E3E6E2", borderRadius: 99, overflow: "hidden" } },
      h("div", { style: { height: "100%", width: pct + "%", background: "#3E6B52", transition: "width .3s" } })
    ),
    h("div", { style: { fontSize: 12, color: "#7A817A", marginTop: 6, textAlign: "right" } },
      props.label || (pct + "%"))
  );
}

function StartScreen(props) {
  const [code, setCode] = useState("");
  const [nick, setNick] = useState("");
  const [agree, setAgree] = useState(false);
  const [err, setErr] = useState("");
  const [loading, setLoading] = useState(false);
  const [duplicateEntry, setDuplicateEntry] = useState(false);
  const startingRef = useRef(false);

  async function start(confirmedRetake) {
    if (startingRef.current) return;
    setErr("");
    if (!code.trim()) { setErr("진단코드를 입력해 주세요."); return; }
    if (!nick.trim()) { setErr("닉네임을 입력해 주세요."); return; }
    if (!agree) { setErr("결과 저장 안내에 동의해 주세요."); return; }
    if (code.trim().length > 40 || nick.trim().length > 40) { setErr("코드와 이름은 각각 40자 이내로 입력해 주세요."); return; }
    const isRetake = confirmedRetake === true;
    if (isRetake && !duplicateEntry) return;
    startingRef.current = true;
    setLoading(true);
    try {
    // 통신·서버 오류일 때만 최대 2회 자동 재시도. 정상 응답(미등록 코드)은 재시도 안 함.
    var attempts = 3; // 첫 시도 + 2회 재시도
    var lastErr = false;
    for (var i = 0; i < attempts; i++) {
      try {
        const r = await api("validate", { code: sanitize(code), nick: nick.trim(), entryVersion: 5 });
        // 서버 오류({ok:false})나 응답 없음 → catch로 보내 재시도
        if (!r || r.ok !== true) throw new Error("server error");
        // 정상 통신: valid로 판단
        if (r.valid) {
          if (!(Number(r.entryVersion) >= 5) || typeof r.nicknameExists !== "boolean") {
            setErr("앱 업데이트가 아직 완료되지 않았습니다. 진행자에게 백엔드 배포 확인을 요청해 주세요.");
            return;
          }
          if (r.nicknameExists && !isRetake) { setDuplicateEntry(true); return; }
          props.onStart(sanitize(code), nick.trim(), String(r.mode) === "72" ? "72" : "96", isRetake ? "retake" : "first");
          return;
        }
        // 정상 응답이지만 미등록 코드 → 재시도하지 않고 즉시 안내
        setLoading(false);
        setErr("등록되지 않은 진단코드입니다. 진행자에게 확인해 주세요.");
        return;
      } catch (e) {
        lastErr = true;
        if (i < attempts - 1) await sleep(500 + Math.floor(Math.random() * 1000));
      }
    }
    setLoading(false);
    if (lastErr) setErr("연결에 문제가 있습니다. 잠시 후 다시 시도해 주세요.");
    } finally { startingRef.current = false; setLoading(false); }
  }

  const inputStyle = {
    width: "100%", padding: "13px 14px", fontSize: 16, borderRadius: 10,
    border: "1px solid rgba(255,255,255,0.25)", background: "rgba(255,255,255,0.94)",

  // 밤하늘 별 (고정 배치)
  const stars = [
    [42,70,0.8,0], [120,48,1.1,1], [210,90,0.7,0], [300,58,1.1,1],
    [345,120,0.8,0], [60,150,0.9,1], [270,160,0.7,0], [160,120,1.4,1],
    [330,210,0.7,0], [30,230,0.8,0], [355,300,0.6,0], [20,400,0.7,0],

  ];
  const constellation = [[120,48],[160,120],[210,90],[60,150],[300,58]];

  return h("div", { style: { minHeight: "100vh", background: "#111A2E", position: "relative", overflow: "hidden" } },
    // 밤하늘 SVG
    h("svg", {
      style: { position: "absolute", top: 0, left: 0, width: "100%", height: "100%", pointerEvents: "none" },
      viewBox: "0 0 380 640", preserveAspectRatio: "xMidYMid slice", "aria-hidden": "true"
    },
      lines.map(function (l, i) {
        return h("line", { key: "l" + i, x1: l[0], y1: l[1], x2: l[2], y2: l[3],
          stroke: "#C9A24B", strokeWidth: 0.7, opacity: 0.5 });
      }),

        return h("circle", { key: "s" + i, cx: s[0], cy: s[1], r: s[2],
          fill: "#E8ECF5", opacity: 0.55,
          className: s[3] ? "sky-star" : null,
          style: s[3] ? { animationDelay: (i * 0.7) + "s" } : null });
      }),
      constellation.map(function (c, i) {

      })
    ),
    // 내용
    h("div", { className: "wrap", style: { position: "relative", padding: "48px 18px 56px" } },
      h("div", { style: { fontSize: 11, letterSpacing: 3, color: "#B9903E", fontWeight: 600 } }, "STRENGTH DISCOVERY · 문항 파일럿"),
      h("h1", { style: { fontSize: 26, lineHeight: 1.42, margin: "16px 0 0", fontWeight: 700, color: "#EEF1F7", letterSpacing: "-0.3px" } },
        h("span", { style: { color: "#D9B65E" } }, "강점"), "을 발견하고,", h("br"),
        "나만의 ", h("span", { style: { color: "#D9B65E" } }, "탁월함"), "을 깨우다"),
      h("p", { style: { fontSize: 14.5, lineHeight: 1.75, color: "#C3CAD8", marginTop: 16 } },

      h("div", { style: {

        border: "1px solid rgba(201,162,75,0.22)", borderRadius: 14, padding: "18px 16px"

        h("label", { htmlFor: "sd-code", style: labelStyle }, "진단코드"),

        }),

        h("input", {

          onChange: function (e) { setNick(e.target.value); setDuplicateEntry(false); setErr(""); }
        }),
        h("label", { style: { display: "flex", alignItems: "flex-start", gap: 9, cursor: "pointer", marginTop: 15 } },
          h("input", {

        )

      err ? h("div", { style: { color: "#F0A58C", fontSize: 14, marginTop: 14 } }, err) : null,

        h("div", { style: { fontSize: 15, fontWeight: 700, marginBottom: 8 } }, "같은 이름으로 저장된 결과가 있습니다."),

/* ---------- 문항 화면 ---------- */
const PER_PAGE = 6; // 한 화면 6문항

function QuizScreen(props) {
  const items = props.items; // 진단코드의 문항형에 따라 셔플된 96문항 또는 72문항
  const [page, setPage] = useState(0);
  const [answers, setAnswers] = useState({});
  const totalPages = Math.ceil(items.length / PER_PAGE);
  const topRef = useRef(null);

  const pageItems = items.slice(page * PER_PAGE, page * PER_PAGE + PER_PAGE);
  const answeredOnPage = pageItems.filter(function (q) { return answers[q.id] != null; }).length;
  const pageComplete = answeredOnPage === pageItems.length;
  const totalAnswered = Object.keys(answers).length;

  useEffect(function () {
    if (topRef.current) topRef.current.scrollIntoView({ block: "start" });
    window.scrollTo(0, 0);
  }, [page]);

  function pick(id, val) {
    setAnswers(function (prev) {
      const n = Object.assign({}, prev); n[id] = val; return n;
    });
  }

  function next() {
    if (page < totalPages - 1) setPage(page + 1);
    else props.onDone(answers);
  }

  const SCALE = [
    { v: 1, t: "전혀 나와\n같지 않다" }, { v: 2, t: "별로 나와\n같지 않다" },
    { v: 3, t: "어느 쪽도\n아니다" }, { v: 4, t: "대체로\n나와 같다" }, { v: 5, t: "매우\n나와 같다" }
  ];

  return h("div", { className: "wrap", style: { padding: "26px 18px 40px" }, ref: topRef },
    h(Progress, {
      value: page + 1, max: totalPages,
      label: "구간 " + (page + 1) + " / " + totalPages + " · 응답 " + totalAnswered + "/" + items.length
    }),
    pageItems.map(function (q, idx) {
      const globalNo = page * PER_PAGE + idx + 1;
      const cur = answers[q.id];
      return h("div", {
        key: q.id,
        style: {
          background: "#fff", borderRadius: 14, padding: "18px 16px 14px",
          marginBottom: 14, border: "1px solid #E8EAE7"
        }
      },
        h("div", { style: { fontSize: 15.5, lineHeight: 1.55, fontWeight: 500, marginBottom: 14 } },
          h("span", { style: { color: "#B4B9B4", fontWeight: 700, marginRight: 7 } }, globalNo),
          q.text),
        h("div", { style: { display: "flex", gap: 6 } },
          SCALE.map(function (s) {
            const on = cur === s.v;
            return h("button", {
              key: s.v, onClick: function () { pick(q.id, s.v); },
              style: {
                flex: 1, padding: "10px 2px", borderRadius: 9,
                border: on ? "2px solid #3E6B52" : "1px solid #DADED9",
                background: on ? "#3E6B52" : "#fff",
                color: on ? "#fff" : "#6A716A",
                fontSize: 11.5, lineHeight: 1.25, whiteSpace: "pre-line", fontWeight: on ? 700 : 500
              }
            }, s.t);
          })
        )
      );
    }),
    h("div", { style: { marginTop: 20, display: "flex", gap: 10 } },
      page > 0 ? h("button", {
        onClick: function () { setPage(page - 1); },
        style: {
          flex: "0 0 90px", padding: "15px 0", borderRadius: 12, fontSize: 15,
          fontWeight: 600, background: "#EAEDE9", color: "#5A615A"
        }
      }, "이전") : null,
      h("div", { style: { flex: 1 } },
        h(Btn, { onClick: next, disabled: !pageComplete },
          !pageComplete ? "이 구간을 모두 응답해 주세요"
            : (page < totalPages - 1 ? "다음 구간" : "응답 완료")))
    )
  );
}

function CheckScreen(props) {
  const top5 = props.top5; // 코드 배열

  const [checks, setChecks] = useState(function () {

        CHECK_LABELS.map(function (cl, i) {

                    flex: 1, padding: "8px 2px", borderRadius: 8, fontSize: 12.5,

                  }
                }, opt);
              })
            )
          );
        })
      );
    }),

    h("div", { style: { marginTop: 18 } },
      h(Btn, { onClick: function () { props.onDone(checks); }, disabled: !allDone },

const SECTION_ORDER = [
  { key: "core", label: "이 강점의 핵심" },
  { key: "work", label: "직장에서의 모습" },
  { key: "relationship", label: "관계에서의 모습" },
  { key: "underuse", label: "덜 드러날 때" },
  { key: "overuse", label: "지나치게 쓰일 때" },
  { key: "balance", label: "균형 있게 활용하는 법" }
];

/* ---------- 결과 공유 텍스트 (참가자·관리자 공용) ----------
   저장된 데이터만으로 결과 화면과 동일한 내용을 텍스트로 재구성한다.
   카톡·메일에 붙여도 읽기 좋도록 구분선·여백·기호(✓)만 사용한다. */
function buildShareText(data) {
  var nick = data.nick || "";
  var scores = data.scores || {};
  var profile = analyzeProfile(scores);
  var status = resultStatusType(data.resultStatus || profile.status);
  var top5 = status === "normal" ? (data.top5 || profile.topCodes) : (status === "ambiguous_cutoff" ? profile.clearCodes : []);
  var checks = data.checks || {};
  var mode = data.mode === "72" ? "72문항" : "96문항";
  var LINE = "━━━━━━━━━━━━━━━━";
  var THIN = "────────────────";
  var out = [];

  out.push(LINE);
  out.push("  강점발견 · " + (status === "normal" ? "나의 대표 강점" : "결과 안내"));
  if (nick) out.push("  " + nick + " 님");
  var when = data.completedAt ? formatKoreaTime(data.completedAt) : "";
  out.push("  " + (when ? when + " · " : "") + mode);
  out.push(LINE);
  out.push("");

  var SEC = SECTION_ORDER;
  if (status === "flat") {
    out.push(NOTE_FLAT); out.push("");
    out.push("함께 살펴볼 24개 강점 (순위 없음)"); out.push("");
    STRENGTHS.forEach(function (s) { out.push("· " + s.name + (s.short ? " — " + s.short : "")); });
    out.push(""); out.push(THIN); out.push("");
  } else if (status === "ambiguous_cutoff") {
    out.push(NOTE_AMBIGUOUS); out.push("");
    if (profile.clearCodes.length) {
      out.push("상대적으로 높게 나타난 강점");
      profile.clearCodes.forEach(function (code) { var s = strengthByCode(code); if (s) out.push("· " + s.name + (s.short ? " — " + s.short : "")); });
      out.push("");
    }
    out.push("상위 경계에서 같은 점수로 나타난 강점 (순위 없음)");
    profile.tiedCodes.forEach(function (code) { var s = strengthByCode(code); if (s) out.push("· " + s.name + (s.short ? " — " + s.short : "")); });
    out.push(""); out.push(THIN); out.push("");
  }
  top5.forEach(function (code) {
    var s = strengthByCode(code);
    if (!s) return;
    out.push((status === "normal" ? rankLabel(code, scores) + "위. " : "") + s.name);
    if (s.short) out.push("   " + s.short);
    var lab = checkLabel(checks && checks[code]);
    if (lab) out.push("   ✓ " + lab.text);
    out.push("");
    SEC.forEach(function (sec) {
      var txt = s.sections && s.sections[sec.key];
      if (!txt) return;
      out.push("[" + sec.label + "]");
      out.push(txt);
      out.push("");
    });
    out.push(THIN);
    out.push("");
  });

  /* 조합 해석 */
  var sel = status === "normal" ? selectCombos(top5) : null;
  if (sel && (sel.synergy.length || sel.balance.length)) {
    out.push("나의 상위 강점이 연결되는 방식");
    out.push("");
    if (sel.synergy.length) {
      out.push("· 함께 발휘될 때");
      out.push("");
      sel.synergy.forEach(function (p) {
        out.push("  " + p.strengths.join(" + "));
        out.push("  " + p.synergy);
        out.push("");
      });
    }
    if (sel.balance.length) {
      out.push("· 균형 있게 살펴볼 점");
      out.push("");
      sel.balance.forEach(function (p) {
        out.push("  " + p.strengths.join(" + "));
        out.push("  " + p.balance);
        out.push("");
      });
    }
    out.push(THIN);
    out.push("");
  }

  if (status === "normal" && isCloseAtCut(scores)) { out.push(NOTE_CLOSE); out.push(""); }
  if (status === "normal" && hasHiddenTieFor(scores, top5)) { out.push(NOTE_HIDDEN_TIE); out.push(""); }
  RESULT_DISCLAIMER.split(". ").forEach(function (line, i, arr) {
    out.push(i < arr.length - 1 ? line + "." : line);
  });
  out.push("");
  out.push(BRAND_NAME);

  return out.join("\n");
}

/* 텍스트를 기기 공유 시트(카톡·메일 등)로 보낸다. 공유 미지원 시 클립보드 복사로 대체. */
function shareResultText(data) {
  var text = buildShareText(data);
  var title = "강점발견 결과" + (data.nick ? " · " + data.nick + " 님" : "");
  if (navigator.share) {
    navigator.share({ title: title, text: text }).catch(function (err) {
      // 사용자가 공유창을 취소한 경우(AbortError)엔 아무 것도 하지 않는다.
      if (err && err.name === "AbortError") return;
      copyText(text);
    });
  } else {
    copyText(text);
  }
}

function copyText(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(function () {
      alert("결과 내용을 복사했습니다. 카톡이나 메일에 붙여넣어 공유할 수 있습니다.");
    }).catch(function () { fallbackCopy(text); });
  } else { fallbackCopy(text); }
}
function fallbackCopy(text) {
  try {
    var ta = document.createElement("textarea");
    ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.focus(); ta.select();
    var ok = document.execCommand("copy"); document.body.removeChild(ta);
    if (ok) alert("결과 내용을 복사했습니다. 카톡이나 메일에 붙여넣어 공유할 수 있습니다.");
    else alert("복사가 지원되지 않는 환경입니다. 결과 화면을 캡처해 사용해 주세요.");
  } catch (e) {
    alert("공유가 지원되지 않는 환경입니다. 결과 화면을 캡처해 사용해 주세요.");
  }
}

function ResultScreen(props) {
  const scores = props.scores;
  const top5 = props.top5;
  const checks = props.checks;
  const profile = useMemo(function () { return analyzeProfile(scores); }, [scores]);
  const resultStatus = resultStatusType(props.resultStatus || profile.status);
  const ranked = useMemo(function () { return rankStrengths(scores); }, [scores]);
  const close = useMemo(function () { return isCloseAtCut(scores); }, [scores]);
  // 상위 강점과 동점인 강점이 더 있는지 (6개 상한으로 잘렸을 수 있음)
  const hasHiddenTie = useMemo(function () {
    if (!top5 || !top5.length) return false;
    var lastCode = top5[top5.length - 1];
    var lastScore = scores[lastCode];
    var count = 0;
    for (var i = 0; i < ranked.length; i++) if (ranked[i].score === lastScore) count++;
    // 마지막 상위강점과 같은 점수인 강점이 top5에 안 든 게 있으면 true
    return count > top5.filter(function (c) { return scores[c] === lastScore; }).length;
  }, [top5, scores, ranked]);
  const [view, setView] = useState("result");
  const [openCode, setOpenCode] = useState(top5[0]);
  const [showAll, setShowAll] = useState(resultStatus !== "normal");
  const [saved, setSaved] = useState(false);
  const [saving, setSaving] = useState(false);
  const [saveError, setSaveError] = useState(false);
  const savingRef = useRef(false);
  const [resultNick, setResultNick] = useState(props.nick);
  const [participation, setParticipation] = useState(props.participation === "retake" ? "retake" : "first");
  const [nameConflict, setNameConflict] = useState(false);
  const [nameDraft, setNameDraft] = useState(props.nick);
  const [saveMessage, setSaveMessage] = useState("");
  const completionRef = useRef(null);
  if (completionRef.current === null) completionRef.current = props.completedAt || Date.now();
  const completedAt = completionRef.current;

  const ridRef = useRef(null);
  if (ridRef.current === null) ridRef.current = makeId(); // 한 번만 생성, 재시도에도 동일

  async function attemptSave(entry) {
    // 같은 responseId로 저장 → 서버가 중복이면 갱신
    const r = await api("save", {
      code: props.code, nick: entry.nick, responseId: ridRef.current,
      scores: scores, top5: top5, checks: checks, mode: props.mode,
      completedAt: completedAt, participation: entry.participation, resultStatus: resultStatus, entryVersion: 5,
      rawAnswers: props.answers, itemOrder: props.itemOrder, itemBankVersion: ITEM_BANK_VERSION,
      scaleVersion: SCALE_VERSION, quizStartedAt: props.quizStartedAt, quizCompletedAt: props.quizCompletedAt
    });
    return r;
  }

  async function save(isManual, override) {
    if (savingRef.current || saved) return;
    const entry = override || { nick: resultNick, participation: participation };
    if (!entry.nick.trim() || entry.nick.trim().length > 40) {
      setSaveMessage("이름은 1~40자로 입력해 주세요."); return;
    }
    savingRef.current = true;
    setSaving(true); setSaveError(false); setNameConflict(false); setSaveMessage("");
    // 첫 시도는 즉시. 실패하면 1s·3s·6s(+무작위) 간격으로 최대 3회 자동 재시도.
    const delays = [1000, 3000, 6000];
    let ok = false;
    let conflict = false;
    try {
    for (let attempt = 0; attempt <= delays.length; attempt++) {
      try {
        const r = await attemptSave(entry);
        ok = !!(r && r.ok);
        if (ok) break;
        if (r && r.error === "duplicate_name") {
          conflict = true; setNameConflict(true); setNameDraft(entry.nick);
          break; // 동시 시작한 동명이인: 응답을 유지한 채 선택을 요청합니다.
        }
        if (r && ["response_conflict", "invalid_completed_at", "invalid_participation", "invalid_result_status", "invalid_result_profile"].indexOf(r.error) >= 0) {
          setSaveMessage("저장 정보를 확인하지 못했습니다. 결과 이미지를 보관한 뒤 진행자에게 문의해 주세요."); break;
        }
      } catch (e) { ok = false; }
      if (attempt < delays.length) {
        await sleep(delays[attempt] + Math.floor(Math.random() * 800));
      }
    }
    if (ok) setSaved(true); else if (!conflict) setSaveError(true);
    } finally { setSaving(false); savingRef.current = false; }
  }
  function resolveNameConflict(asRetake) {
    const nextNick = asRetake ? resultNick : nameDraft.trim();
    if (!nextNick || nextNick.length > 40) { setSaveMessage("이름은 1~40자로 입력해 주세요."); return; }
    const nextKind = asRetake ? "retake" : "first";
    setResultNick(nextNick); setParticipation(nextKind);
    save(true, {nick: nextNick, participation: nextKind});
  }
  useEffect(function () { save(false); }, []);
  // 결과↔조합 뷰 전환 시 항상 화면 맨 위로 (조합 아래에서 돌아올 때 중간에 머무르지 않도록)
  useEffect(function () { window.scrollTo(0, 0); }, [view]);
  useEffect(function () {
    function warn(e) { e.preventDefault(); e.returnValue = ""; return ""; }
    if (!saved) window.addEventListener("beforeunload", warn);
    return function () { window.removeEventListener("beforeunload", warn); };
  }, [saved]);

  // 저장 상태에 따라 결과를 떠나도 되는지 확인. 미저장(저장중/실패/이름충돌)이면 이탈을 막는다.
  const savedRef = useRef(saved);
  const savingRef2 = useRef(saving);
  const unsavedRef = useRef(false);
  useEffect(function () {
    savedRef.current = saved; savingRef2.current = saving;
    unsavedRef.current = !saved; // 저장 완료 전에는 미저장으로 간주
  }, [saved, saving]);
  function confirmLeaveResult() {
    if (savedRef.current) {
      return window.confirm("처음 화면으로 돌아가 새로 진단할까요? 이 결과는 저장되어 있습니다.");
    }

      window.alert("결과를 저장하는 중입니다. 저장이 끝난 뒤 이동해 주세요.");

  }

  // 폰 뒤로가기 처리. history 항목은 '결과 baseline 1개'만 유지한다.
  //  - 결과 진입 시 baseline 1개 push
  //  - 조합 진입 시 1개 push, 조합에서 나갈 땐 history.back()으로 그 항목을 소비(pushState 안 함)
  //  - popstate에서 조합이면 result로만 전환(push 안 함) → baseline 유지
  //  - 결과에서 뒤로가기(=baseline 소비)면 이탈 확인. 남으면 baseline만 다시 1개 복원.
  const viewRef = useRef(view);
  useEffect(function () { viewRef.current = view; }, [view]);
  const prevViewRef = useRef("result");
  useEffect(function () {
    try { window.history.pushState({ sd: "result" }, ""); } catch (e) {}
    function onPop() {
      if (viewRef.current === "combo") {
        setView("result"); // baseline은 그대로 (여기서 push하지 않음)
        return;
      }
      // 결과 화면에서 뒤로가기 → 이탈 확인
      if (confirmLeaveResult()) {
        if (props.onRestart) { props.onRestart(); return; }
      }
      // 남는다: baseline 1개 복원 (누적되지 않음 — 방금 소비된 항목을 대체)
      try { window.history.pushState({ sd: "result" }, ""); } catch (e2) {}
    }
    window.addEventListener("popstate", onPop);
    return function () { window.removeEventListener("popstate", onPop); };
  }, []);
  // 결과→조합 전환 시에만 history 1개 추가 (뒤로가기 한 번이 결과로 돌아오게)
  useEffect(function () {
    if (prevViewRef.current === "result" && view === "combo") {
      try { window.history.pushState({ sd: "combo" }, ""); } catch (e) {}

    var comboCodes = resultStatus === "normal" ? top5 : (profile.clearCodes || []);
    return h(ComboScreen, { top5: comboCodes, completedAt: completedAt, mode: props.mode, onBack: function () { window.history.back(); },

    h("div", { style: { fontSize: 11.5, color: "#9AA09A", marginBottom: 4 } },

    saved ? h("div", { style: { fontSize: 12, color: "#3E7C5A", marginBottom: 20 } }, "✓ 결과가 저장되었습니다")
      : nameConflict ? h("div", { role: "alert", style: { marginBottom: 20, padding: 15, borderRadius: 10, background: "#FBF2E5", border: "1px solid #E4C694" } },
          h("div", { style: { fontSize: 14, fontWeight: 700 } }, "응답하는 동안 같은 이름의 결과가 먼저 저장되었습니다."),
          h("p", { style: { fontSize: 13, lineHeight: 1.65 } }, "입력한 응답과 완료 시각은 유지됩니다. 재진단이라면 그대로 추가하고, 동명이인이라면 이름을 바꿔 저장해 주세요."),

          h(Btn, { onClick: function () { resolveNameConflict(false); }, disabled: saving, color: "#4A514A", style: { fontSize: 14 } }, "바꾼 이름으로 저장하기"),
          saveMessage ? h("p", { style: { fontSize: 12, color: "#B0492E" } }, saveMessage) : null)
      : saveError ? h("div", { style: { marginBottom: 20, padding: 12, background: "#F5EAE6", borderRadius: 10 } },
          h("div", { style: { fontSize: 13, color: "#B0492E", marginBottom: 8 } }, saveMessage || "결과가 아직 저장되지 않았습니다."),
          h("button", { onClick: function () { save(true); }, disabled: saving,
            style: { padding: "8px 16px", borderRadius: 8, background: "#3E6B52", color: "#fff", fontSize: 13, fontWeight: 600 } },
            saving ? "저장 중…" : "다시 저장하기"))
      : h("div", { style: { fontSize: 12, color: "#9AA09A", marginBottom: 20 } }, saving ? "저장 중…" : ""),

    resultStatus !== "normal" ? h("div", { role: "status", style: {
      marginBottom: 18, padding: 16, borderRadius: 12, background: "#FBF2E5",

    } }, resultStatus === "flat" ? NOTE_FLAT : NOTE_AMBIGUOUS) : null,

    /* 강점 상세 카드 렌더 (상위 강점·동점 강점 공용) */
    (function () {
      function strengthCard(code, opts) {

        if (!s) return null;
        const color = VIRTUE_COLOR[s.virtue] || "#3E6B52";

        /* 상대적으로 가장 높게 나타난 강점 (또는 일반 결과의 상위 강점) */

    } }, "상위 강점들의 점수 차이가 크지 않습니다. 순위 자체보다, 이 강점들이 실제 경험에서 어떻게 나타나는지 살펴보는 것이 더 중요합니다.") : null,

    resultStatus === "normal" && hasHiddenTie ? h("div", { style: {
      marginBottom: 8, padding: 13, background: "#EEF1ED",
      borderRadius: 10, fontSize: 12.5, lineHeight: 1.55, color: "#5A615A"
    } }, "같은 점수의 강점이 여러 개 있어, 일부 강점은 아래 전체 순위에서 함께 확인할 수 있습니다.") : null,

    h("div", { style: { marginTop: 22 } },

    h("div", { style: { marginTop: 26 } },
      h(Btn, { onClick: function () {

      }, color: "#3E6B52" },
        "결과 텍스트 공유하기 (카톡·메일)")),

    h("div", { style: { marginTop: 12 } },

    h("div", { style: { marginTop: 12 } },
      h(Btn, { onClick: function () { downloadResultPNG(resultNick, scores, top5, checks, completedAt, props.mode, participation, resultStatus); }, color: "#4A514A" },

    props.onRestart ? h("div", { style: { marginTop: 12 } },
      h(Btn, { onClick: function () {
        // history.back()으로 popstate 흐름을 타게 한다 → result baseline이 소비되고

        // (여기서 직접 확인창을 띄우거나 onRestart를 호출하면 baseline이 남아 히스토리가 누적된다.)
        window.history.back();
      }, color: "#6E7891" },
        "처음으로 · 새로 진단하기")) : null,

    h("div", { style: { marginTop: 28, fontSize: 12, color: "#9AA09A", lineHeight: 1.65 } },

}

/* ---------- 결과 PNG ---------- */
function downloadResultPNG(nick, scores, top5, checks, completedAt, mode, participation, resultStatusValue) {
  const W = 720, pad = 48;
  const profile = analyzeProfile(scores || {});
  const status = resultStatusType(resultStatusValue || profile.status);
  const specialCodes = status === "flat" ? STRENGTHS.map(function (s) { return s.code; }) : profile.tiedCodes;
  const cv = document.createElement("canvas");
  const dpr = 2; cv.width = W * dpr;
  const lineH = 104;
  const H = status === "normal" ? 340 + top5.length * lineH + 120 : 520 + specialCodes.length * 32;
  cv.height = H * dpr;
  const ctx = cv.getContext("2d");
  ctx.scale(dpr, dpr);

  ctx.fillStyle = "#F5F6F4"; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = "#8A918A"; ctx.font = "600 15px sans-serif";
  ctx.fillText("강 점 발 견", pad, 60);
  ctx.fillStyle = "#2A2E2A"; ctx.font = "700 30px sans-serif";
  ctx.fillText(nick + " 님의 " + (status === "normal" ? "대표 강점" : "결과 안내"), pad, 104);
  ctx.fillStyle = "#7A817A"; ctx.font = "400 15px sans-serif";
  ctx.fillText("나만의 탁월함으로 발전시킬 강점", pad, 134);
  ctx.fillStyle = "#6A716A"; ctx.font = "400 13px sans-serif";
  ctx.fillText("진단 완료: " + formatKoreaTime(completedAt) + " · " + (mode === "72" ? "72문항" : "96문항") + " · " + participationLabel(participation || "first"), pad, 158);

  let y = 196;
  if (status !== "normal") {
    ctx.fillStyle = "#5A5146"; ctx.font = "400 15px sans-serif";
    wrapText(ctx, status === "flat" ? NOTE_FLAT : NOTE_AMBIGUOUS, pad, y, W - pad * 2, 23);
    y += status === "flat" ? 112 : 92;
    ctx.fillStyle = "#2A2E2A"; ctx.font = "700 17px sans-serif";
    ctx.fillText(status === "flat" ? "함께 살펴볼 24개 강점 · 순위 없음" : "상위 경계 동점 강점 · 순위 없음", pad, y);
    y += 30;
    specialCodes.forEach(function (code) {
      var s = strengthByCode(code); if (!s) return;
      ctx.fillStyle = "#2A2E2A"; ctx.font = "600 14px sans-serif"; ctx.fillText("· " + s.name, pad, y);
      if (s.short) { ctx.fillStyle = "#8A918A"; ctx.font = "400 12px sans-serif"; ctx.fillText(s.short, pad + 100, y); }
      y += 32;
    });

    return (y.priority - x.priority)
      || (crossFn(y) - crossFn(x))
      || (rankSum(x) - rankSum(y))
      || (x.key < y.key ? -1 : 1);
  });

  var used = {}; var MAX_APPEAR = 2;
  function ap(c) { return used[c] || 0; }
  function bump(p) { var s = p.key.split("-"); used[s[0]] = ap(s[0]) + 1; used[s[1]] = ap(s[1]) + 1; }

  /* 시너지 3쌍: 상위 강점 전부(최대 6개)를 최소 1회 등장시키는 그리디 셋커버.
     아직 안 나온 상위 강점을 더 많이 덮는 쌍을 먼저, 동률이면 기본 정렬 순서. */
  var covered = {}; var chosenSyn = [];
  var TARGET = Math.min(3, pairs.length);
  function newlyCovers(p) { var s = p.key.split("-"); return (covered[s[0]] ? 0 : 1) + (covered[s[1]] ? 0 : 1); }
  while (chosenSyn.length < TARGET) {
    var best = null, bestGain = -1, bestIdx = 1e9;
    for (var a = 0; a < baseOrder.length; a++) {
      var p = baseOrder[a];
      if (chosenSyn.indexOf(p) >= 0) continue;
      var s = p.key.split("-");
      if (ap(s[0]) >= MAX_APPEAR || ap(s[1]) >= MAX_APPEAR) continue;
      var gain = newlyCovers(p);
      if (gain > bestGain || (gain === bestGain && a < bestIdx)) { best = p; bestGain = gain; bestIdx = a; }
    }
    if (!best) break;
    chosenSyn.push(best); bump(best);
    var bs = best.key.split("-"); covered[bs[0]] = 1; covered[bs[1]] = 1;
  }
  if (chosenSyn.length < Math.min(2, pairs.length)) {
    for (var b = 0; b < baseOrder.length; b++) {
      if (chosenSyn.length >= Math.min(2, pairs.length)) break;
      if (chosenSyn.indexOf(baseOrder[b]) >= 0) continue;
      chosenSyn.push(baseOrder[b]); bump(baseOrder[b]);
    }
  }

  /* 균형 1~2쌍: 시너지 쌍 우선 재사용, 조언/위험 장면 유사 시 교체(방어), 등장상한 유지 */
  var chosenBal = []; var seenAdv = {}, seenRsk = {};
  var balCand = chosenSyn.concat(baseOrder.filter(function (p) { return chosenSyn.indexOf(p) < 0; }));
  for (var c = 0; c < balCand.length; c++) {
    if (chosenBal.length >= 2) break;
    var pb = balCand[c]; var sb = pb.key.split("-");
    if (ap(sb[0]) >= MAX_APPEAR || ap(sb[1]) >= MAX_APPEAR) continue;
    var as = comboAdviceSig(pb.balance), rs = comboRiskSig(pb.balance);
    if (seenAdv[as] || seenRsk[rs]) continue;
    chosenBal.push(pb); seenAdv[as] = 1; seenRsk[rs] = 1; bump(pb);
  }
  if (chosenBal.length < 1) {
    for (var d = 0; d < balCand.length; d++) {
      var pd = balCand[d];
      var ad = comboAdviceSig(pd.balance), rd = comboRiskSig(pd.balance);
      if (seenAdv[ad] || seenRsk[rd]) continue;
      chosenBal.push(pd); break;
    }
    if (chosenBal.length < 1 && balCand.length) chosenBal.push(balCand[0]);
  }
  return { synergy: chosenSyn, balance: chosenBal };
}


/* ---------- 조합 해석 화면 ---------- */
function ComboScreen(props) {
  var top = props.top5;
  var sel = useMemo(function () { return selectCombos(top); }, [top]);
  useEffect(function () { window.scrollTo(0, 0); }, []);

  function nameOf(code) { var s = strengthByCode(code); return s ? s.name : code; }
  function colorOf(pair) {
    var s = strengthByCode(pair.key.split("-")[0]);
    return (s && VIRTUE_COLOR[s.virtue]) || "#3E6B52";
  }

  return h("div", { className: "wrap", style: { padding: "30px 18px 60px" } },
    h("div", { style: { fontSize: 12, letterSpacing: 3, color: "#8A918A", fontWeight: 600 } }, "나의 강점발견"),
    h("h1", { style: { fontSize: 22, fontWeight: 700, margin: "8px 0 4px" } }, "나의 상위 강점이 연결되는 방식"),
    props.completedAt ? h("div", { style: { fontSize: 11.5, color: "#7A817A", lineHeight: 1.6, margin: "8px 0" } }, "진단 완료: " + formatKoreaTime(props.completedAt) + " · " + (props.mode === "72" ? "72문항" : "96문항")) : null,
    h("p", { style: { fontSize: 13.5, color: "#7A817A", marginBottom: 18, lineHeight: 1.6 } },
      "여러 강점이 함께 작동할 때 나타나는 모습입니다. 아래는 검토된 해석 문장으로, 실제 경험에 비추어 살펴보시면 도움이 됩니다."),

    /* 시너지 */
    h("div", { style: { fontSize: 13, fontWeight: 700, color: "#3E6B52", margin: "6px 0 10px" } }, "함께 발휘될 때"),
    sel.synergy.map(function (p, i) {
      var color = colorOf(p);
      var names = p.strengths.join(" + ");
      return h("div", {
        key: "syn" + i,
        style: { background: "#fff", borderRadius: 14, marginBottom: 12, border: "1px solid #E8EAE7", padding: "16px 16px" }
      },
        h("div", { style: { display: "flex", flexWrap: "wrap", alignItems: "center", gap: 8, marginBottom: 8 } },
          h("span", { style: { fontSize: 11, fontWeight: 700, color: "#fff", background: color, borderRadius: 6, padding: "2px 8px" } }, names)
        ),
        h("div", { style: { fontSize: 14.5, lineHeight: 1.68, color: "#3E453E" } }, p.synergy)
      );
    }),

    /* 균형 */
    sel.balance.length ? h("div", { style: { fontSize: 13, fontWeight: 700, color: "#9A6B3E", margin: "20px 0 10px" } }, "균형 있게 살펴볼 점") : null,
    sel.balance.map(function (p, i) {
      var names = p.strengths.join(" + ");
      return h("div", {
        key: "bal" + i,
        style: { background: "#FBF7F2", borderRadius: 14, marginBottom: 12, border: "1px solid #EDE3D6", padding: "16px 16px" }
      },
        h("div", { style: { display: "flex", flexWrap: "wrap", fontSize: 11, fontWeight: 700, color: "#9A6B3E", marginBottom: 8 } }, names),
        h("div", { style: { fontSize: 14.5, lineHeight: 1.68, color: "#4A453E" } }, p.balance)
      );
    }),

    h("div", { style: { marginTop: 14, padding: 13, background: "#EEF1ED", borderRadius: 10, fontSize: 12.5, lineHeight: 1.55, color: "#5A615A" } },
      "이 해석은 강점의 조합에서 나타날 수 있는 모습을 설명한 것으로, 순위나 진단 결과를 바꾸지 않습니다. 나에게 해당하는지 실제 경험에 비추어 살펴보세요."),

    props.shareData ? h("div", { style: { marginTop: 22 } },
      h(Btn, { onClick: function () { shareResultText(props.shareData); }, color: "#3E6B52" },
        "결과 텍스트 공유하기 (카톡·메일)")) : null,
    props.shareData ? h("div", { style: { marginTop: 12 } },
      h(Btn, { onClick: function () { downloadResultPDF(props.shareData); }, color: "#4A7C8C" },
        "결과 PDF로 저장·인쇄")) : null,
    props.onSavePNG ? h("div", { style: { marginTop: 12 } },
      h(Btn, { onClick: function () { props.onSavePNG(); }, color: "#4A514A" },
        "결과 이미지 저장하기")) : null,

    h("div", { style: { marginTop: 12 } },
      h(Btn, { onClick: function () { props.onBack(); }, color: "#6E7891" }, "강점 순위로 돌아가기")),
    h(BrandMark, null)
  );
}

function App() {
  const [screen, setScreen] = useState("start"); // start, quiz, check, result, admin (조합해석은 result 내부 뷰)
  const [code, setCode] = useState("");
  const [nick, setNick] = useState("");
  const [mode, setMode] = useState("96");
  const [items, setItems] = useState([]);
  const [answers, setAnswers] = useState(null);
  const [scores, setScores] = useState(null);
  const [top5, setTop5] = useState(null);
  const [checks, setChecks] = useState(null);
  const [participation, setParticipation] = useState("first");
  const [completedAt, setCompletedAt] = useState(null);
  const [resultStatus, setResultStatus] = useState("normal");
  const [quizStartedAt, setQuizStartedAt] = useState(null);
  const [quizCompletedAt, setQuizCompletedAt] = useState(null);

  function onStart(c, n, selectedMode, kind) {
    var m = String(selectedMode) === "72" ? "72" : "96";
    setCode(c); setNick(n); setMode(m);
    setParticipation(kind === "retake" ? "retake" : "first"); setCompletedAt(null); setResultStatus("normal");
    setQuizStartedAt(Date.now()); setQuizCompletedAt(null);
    setItems(shuffleSpread(questionItemsForMode(m)));
    setScreen("quiz");
  }

  function onQuizDone(ans) {
    const sc = computeScores(ans);
    setQuizCompletedAt(Date.now());
    var profile = analyzeProfile(sc);
    setAnswers(ans); setScores(sc); setResultStatus(profile.status);
    if (profile.status === "normal") {
      setTop5(profile.topCodes); setScreen("check");
    } else {
      // 대표 강점의 경계를 신뢰하기 어려우므로 임의로 자르거나 경험확인·조합해석을 만들지 않습니다.
      setTop5(profile.status === "ambiguous_cutoff" ? profile.clearCodes : []);
      setChecks({}); setCompletedAt(Date.now()); setScreen("result");
    }
  }

  function onCheckDone(chk) { setChecks(chk); setCompletedAt(Date.now()); setScreen("result"); }

  // 진단 진행 중(문항/경험확인) 새로고침·창닫기 경고
  useEffect(function () {
    var risky = (screen === "quiz" || screen === "check");
    function warn(e) { e.preventDefault(); e.returnValue = ""; return ""; }
    if (risky) window.addEventListener("beforeunload", warn);
    return function () { window.removeEventListener("beforeunload", warn); };
  }, [screen]);

  if (screen === "admin")
    return h(AdminScreen, { onBack: function () { setScreen("start"); } });
  if (screen === "quiz")
    return h(QuizScreen, { items: items, onDone: onQuizDone });
  if (screen === "check")
    return h(CheckScreen, { top5: top5, onDone: onCheckDone });
  if (screen === "result")
    return h(ResultScreen, { code: code, nick: nick, mode: mode, scores: scores, top5: top5, checks: checks, resultStatus: resultStatus, participation: participation, completedAt: completedAt, answers: answers, itemOrder: items.map(function (q) { return q.id; }), quizStartedAt: quizStartedAt, quizCompletedAt: quizCompletedAt, saved: false, onRestart: function () { setScreen("start"); } });
  return h(StartScreen, { onStart: onStart, onAdmin: function () { setScreen("admin"); } });
}

ReactDOM.createRoot(document.getElementById("root")).render(h(App));

</script>
